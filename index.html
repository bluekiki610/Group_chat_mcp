<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人❤️机の小窝</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:linear-gradient(135deg,#1a1a2e,#16213e); height:100vh; display:flex; justify-content:center; align-items:center; }
.app { width:100%; max-width:480px; height:100vh; max-height:900px; background:#f7f7f7; display:flex; flex-direction:column; position:relative; box-shadow:0 0 30px rgba(0,0,0,.4); }
header { background:#2d3e50; color:#fff; padding:12px 15px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.3); z-index:5; }
.header-title { font-size:17px; font-weight:bold; display:flex; align-items:center; gap:8px; }
.header-title .room-emoji { font-size:20px; }
.online-badge { font-size:11px; background:rgba(255,255,255,.15); padding:3px 8px; border-radius:10px; cursor:pointer; }
.header-btns { display:flex; gap:8px; }
.hbtn { background:rgba(255,255,255,.15); border:none; color:#fff; padding:5px 10px; border-radius:8px; font-size:13px; cursor:pointer; }
.hbtn:active { background:rgba(255,255,255,.3); }
.room-tabs { display:flex; gap:6px; padding:8px 12px; background:#e8edf2; overflow-x:auto; flex-shrink:0; }
.room-tab { background:#fff; border:none; padding:6px 14px; border-radius:15px; font-size:13px; cursor:pointer; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.1); }
.room-tab.active { background:#07c160; color:#fff; }
#msgArea { flex:1; overflow-y:auto; padding:12px; background:#f0f2f5; }
.msg { display:flex; margin-bottom:14px; }
.msg .avatar { width:38px; height:38px; border-radius:6px; flex-shrink:0; background:#d8dee8; display:flex; align-items:center; justify-content:center; font-size:18px; overflow:hidden; }
.msg .avatar img { width:100%; height:100%; object-fit:cover; }
.msg .body { margin:0 8px; max-width:70%; }
.msg .meta { font-size:11px; color:#999; margin-bottom:3px; }
.msg .bubble { padding:9px 12px; border-radius:10px; font-size:15px; line-height:1.5; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.08); }
.msg.me { flex-direction:row-reverse; }
.msg.me .meta { text-align:right; }
.msg.me .bubble { background:#95ec69; }
.msg.other .bubble { background:#fff; }
.msg.system { justify-content:center; }
.msg.system .bubble { background:transparent; color:#999; font-size:12px; box-shadow:none; padding:2px 10px; }
.sys-tip { text-align:center; color:#aaa; font-size:12px; padding:4px; }
footer { background:#f7f7f7; border-top:1px solid #e0e0e0; padding:8px 10px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
#msgInput { flex:1; border:1px solid #ddd; border-radius:8px; padding:9px 12px; font-size:15px; outline:none; background:#fff; }
#sendBtn { background:#07c160; color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:15px; cursor:pointer; }
#sendBtn:active { opacity:.8; }
.modal-mask { position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:20; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:14px; width:88%; max-height:85%; overflow-y:auto; padding:18px; }
.modal h3 { font-size:16px; margin-bottom:12px; color:#333; }
.set-group { margin-bottom:14px; border-bottom:1px dashed #eee; padding-bottom:12px; }
.set-group label { font-size:13px; color:#666; display:block; margin-bottom:6px; }
.input { width:100%; border:1px solid #ddd; border-radius:8px; padding:8px 10px; font-size:14px; outline:none; margin-bottom:8px; }
.btn { background:#07c160; color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; margin-right:6px; }
.btn.gray { background:#8a8a8a; }
.btn.red { background:#e64340; }
.btn:active { opacity:.8; }
.tip { font-size:12px; color:#888; margin-top:4px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.room-item { display:flex; align-items:center; justify-content:space-between; background:#f5f5f5; border-radius:8px; padding:7px 10px; margin-bottom:6px; font-size:13px; }
.room-item .lock { font-size:11px; color:#999; }
.member-chip { display:inline-block; background:#e8f5e9; color:#2e7d32; border-radius:12px; padding:3px 10px; font-size:12px; margin:3px 4px 3px 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-title">
      <span class="room-emoji" id="roomEmoji">🏠</span>
      <span id="roomName">客厅</span>
      <span class="online-badge" id="onlineBadge" onclick="showOnline()" title="点我查看在线成员">0 在线</span>
    </div>
    <div class="header-btns">
      <button class="hbtn" onclick="openSettings()">⚙️ 设置</button>
    </div>
  </header>

  <div class="room-tabs" id="roomTabs"></div>

  <div id="msgArea"></div>

  <footer>
    <input id="msgInput" placeholder="说点什么吧…" autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </footer>

  <!-- 设置面板 -->
  <div class="modal-mask" id="settingsMask" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <h3>⚙️ 设置</h3>

      <div class="set-group">
        <label>👤 我的名字</label>
        <div class="row">
          <input class="input" id="setName" placeholder="输入昵称" style="flex:1">
          <button class="btn" onclick="saveName()">保存</button>
        </div>
      </div>

      <div class="set-group">
        <label>🖼️ 设置头像（给谁设？）</label>
        <div class="row">
          <input class="input" id="avatarName" placeholder="成员名字" style="flex:1">
          <input type="file" id="avatarFile" accept="image/*" style="font-size:12px">
        </div>
        <button class="btn" onclick="uploadAvatar()">上传头像</button>
      </div>

      <div class="set-group">
        <label>🔊 自动朗读（填名字，逗号分隔，如：黎深,秦彻）</label>
        <div class="row">
          <input class="input" id="setSpeak" placeholder="要朗读的成员名字" style="flex:1">
        </div>
        <label style="margin-top:6px"><input type="checkbox" id="speakAll" onchange="saveSpeak()"> 朗读所有人的新消息</label>
        <button class="btn" onclick="saveSpeak()">保存朗读设置</button>
      </div>

      <div class="set-group">
        <label>🚪 房间管理（当前房间：<span id="setCurRoom">客厅</span>）</label>
        <div class="row">
          <input class="input" id="setRoomName" placeholder="房间名" style="flex:1">
          <input class="input" id="setRoomPwd" placeholder="密码(可选)" style="width:90px">
        </div>
        <button class="btn" onclick="createRoom()">创建房间</button>
        <button class="btn gray" onclick="joinRoomByName()">加入房间</button>
        <button class="btn red" onclick="deleteRoomByName()">删除房间</button>
        <div class="tip">加入时若房间有密码需输入密码</div>
        <div id="roomList" style="margin-top:8px"></div>
      </div>

      <div class="set-group">
        <label>👥 在线成员（当前房间）</label>
        <div id="memberList" class="tip">加载中…</div>
      </div>

      <div class="set-group">
        <label>⏰ 时间设置（当前房间）</label>
        <div class="row">
          <select class="input" id="setTimeMode" style="flex:1">
            <option value="real">现实时间（北京时间）</option>
            <option value="fixed">剧情时间（固定）</option>
          </select>
          <input class="input" id="setFixedTime" placeholder="如 19:00" style="width:90px">
        </div>
        <button class="btn" onclick="saveTimeSettings()">保存时间</button>
      </div>

      <button class="btn gray" style="width:100%;margin-top:6px" onclick="closeSettings()">关闭</button>
    </div>
  </div>
</div>

<script>
// ==================== 状态 ====================
var userName = localStorage.getItem('gc_name') || '';
var currentRoom = localStorage.getItem('gc_room') || 'main';
var roomPassword = localStorage.getItem('gc_pwd_' + currentRoom) || '';
var onlineList = [];
var avatars = {};
var lastMsgKey = '';
var speakNames = (localStorage.getItem('gc_speak') || '').split(',').filter(Boolean);
var speakAll = localStorage.getItem('gc_speakAll') === '1';

// ==================== 工具 ====================
function api(url, options) {
  return fetch(url, options).then(function(r) {
    if (!r.ok) return r.json().then(function(d){ throw new Error((d.detail || ('HTTP ' + r.status))); });
    return r.json();
  });
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function toast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;transition:opacity .4s';
  t.textContent = msg;
  document.querySelector('.app').appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 400); }, 2200);
}

function roomLabel(r) { return r === 'main' ? '客厅' : r; }
function roomEmoji(r) { return r === 'main' ? '🏠' : '🚪'; }

// ==================== 首次设置名字 ====================
if (!userName) {
  userName = prompt('欢迎来到人❤️机の小窝！请输入你的名字：', '亦言');
  if (!userName) userName = '亦言';
  localStorage.setItem('gc_name', userName);
}

// ==================== 发送消息 ====================
function sendMessage() {
  var input = document.getElementById('msgInput');
  var content = input.value.trim();
  if (!content) return;
  input.value = '';
  api('/api/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sender: userName, content: content, role: 'user', room: currentRoom, password: roomPassword })
  }).then(function(d) {
    cachePush({ sender: userName, content: content, role: 'user', time: d.time || '', room: currentRoom });
    loadMessages(true);
  }).catch(function(e) {
    toast('❌ 无法发送：' + e.message);
    console.error(e);
  });
}

document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});

// ==================== 消息加载/轮询 ====================
function cacheKey() { return 'gc_msgs_' + currentRoom; }

function cachePush(m) {
  var arr = JSON.parse(localStorage.getItem(cacheKey()) || '[]');
  arr.push(m);
  if (arr.length > 400) arr = arr.slice(-400);
  localStorage.setItem(cacheKey(), JSON.stringify(arr));
}

function restoreCache() {
  var arr = JSON.parse(localStorage.getItem(cacheKey()) || '[]');
  if (!arr.length) return Promise.resolve();
  return api('/api/restore', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: arr, room: currentRoom, password: roomPassword })
  }).catch(function(e) { console.warn('restore 失败', e); });
}

function loadMessages(silent) {
  return api('/api/messages?room=' + encodeURIComponent(currentRoom) + '&password=' + encodeURIComponent(roomPassword))
    .then(function(d) {
      var msgs = d.messages || [];
      renderMessages(msgs);
      if (!silent && msgs.length) {
        localStorage.setItem(cacheKey(), JSON.stringify(msgs));
      }
      speakNewMessages(msgs);
    })
    .catch(function(e) {
      if (!silent) toast('⚠️ 加载消息失败：' + e.message);
    });
}

function renderMessages(msgs) {
  var area = document.getElementById('msgArea');
  area.innerHTML = '';
  if (!msgs.length) {
    area.innerHTML = '<div class="sys-tip">✨ 欢迎来到 ' + esc(roomLabel(currentRoom)) + '，说点什么吧~</div>';
    return;
  }
  msgs.forEach(function(m) {
    if (m.sender === 'system') {
      area.appendChild(renderSystem(m.content));
    } else {
      area.appendChild(renderMsg(m));
    }
  });
  area.scrollTop = area.scrollHeight;
}

function renderSystem(text) {
  var d = document.createElement('div');
  d.className = 'msg system';
  d.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
  return d;
}

function renderMsg(m) {
  var d = document.createElement('div');
  var isMe = m.sender === userName;
  d.className = 'msg ' + (isMe ? 'me' : 'other');
  var av = avatars[m.sender];
  var avHtml = av ? '<img src="' + av + '">' : esc((m.sender || '?').charAt(0));
  var nameTag = isMe ? '' : '<span style="color:#07c160;font-weight:bold">' + esc(m.sender) + '</span> ';
  d.innerHTML = '<div class="avatar">' + avHtml + '</div>' +
    '<div class="body"><div class="meta">' + nameTag + '<span>' + esc(m.time || '') + '</span></div>' +
    '<div class="bubble">' + esc(m.content) + '</div></div>';
  return d;
}

function speakNewMessages(msgs) {
  if (!('speechSynthesis' in window)) return;
  if (!speakAll && speakNames.length === 0) return;
  if (!msgs.length) return;
  var last = msgs[msgs.length - 1];
  var key = last.sender + '|' + last.content;
  if (key === lastMsgKey) return;
  lastMsgKey = key;
  var shouldSpeak = (speakAll && last.sender !== userName) || (!speakAll && speakNames.indexOf(last.sender) >= 0);
  if (!shouldSpeak) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance((last.sender === 'system' ? '' : last.sender + '说：') + last.content);
    u.lang = 'zh-CN';
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ==================== 在线成员 ====================
function refreshOnline() {
  api('/api/online').then(function(d) {
    onlineList = d.online || [];
    var count = 0;
    var names = [];
    onlineList.forEach(function(u) {
      if (u.room === currentRoom) { count++; names.push(u.name); }
    });
    document.getElementById('onlineBadge').textContent = count + ' 在线';
    renderMemberList(names);
  }).catch(function() {});
}

function renderMemberList(names) {
  var el = document.getElementById('memberList');
  if (!el) return;
  if (!names.length) {
    el.innerHTML = '当前房间暂无在线成员';
  } else {
    var html = '';
    names.forEach(function(n) { html += '<span class="member-chip">👤 ' + esc(n) + '</span>'; });
    el.innerHTML = html;
  }
}

function showOnline() {
  api('/api/online').then(function(d) {
    var list = d.online || [];
    var names = [];
    list.forEach(function(u) {
      if (u.room === currentRoom) names.push(u.name);
    });
    if (!names.length) {
      toast('当前房间暂无在线成员');
    } else {
      toast('👥 在线：' + names.join('、'));
    }
  }).catch(function() {});
}

// ==================== 心跳 ====================
function heartbeat() {
  api('/api/heartbeat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: userName, room: currentRoom })
  }).catch(function() {});
  refreshOnline();
}

// ==================== 房间 ====================
function reportRoom() {
  api('/api/current_room', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ room: currentRoom, password: roomPassword })
  }).catch(function() {});
}

function switchRoom(room, pwd) {
  currentRoom = room;
  roomPassword = pwd || '';
  localStorage.setItem('gc_room', room);
  localStorage.setItem('gc_pwd_' + room, roomPassword);
  lastMsgKey = '';
  document.getElementById('roomName').textContent = roomLabel(room);
  document.getElementById('roomEmoji').textContent = roomEmoji(room);
  document.getElementById('setCurRoom').textContent = roomLabel(room);
  var tabs = document.querySelectorAll('.room-tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  var cur = document.getElementById('tab_' + room);
  if (cur) cur.classList.add('active');
  reportRoom();
  restoreCache().then(function() { loadMessages(false); });
  refreshOnline();
  toast('🚪 已进入 ' + roomLabel(room));
}

function enterRoom(room) {
  if (room === currentRoom) return;
  api('/api/rooms').then(function(d) {
    var target = null;
    (d.rooms || []).forEach(function(r) { if (r.name === room) target = r; });
    if (target && target.has_password) {
      var pwd = prompt('房间「' + roomLabel(room) + '」需要密码：', '');
      if (pwd === null) return;
      api('/api/rooms/join', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: room, password: pwd })
      }).then(function() {
        switchRoom(room, pwd);
      }).catch(function(e) { toast('❌ ' + e.message); });
    } else {
      switchRoom(room, '');
    }
  }).catch(function() { switchRoom(room, ''); });
}

function loadRooms() {
  api('/api/rooms').then(function(d) {
    var rooms = d.rooms || [];
    var tabs = document.getElementById('roomTabs');
    tabs.innerHTML = '';
    rooms.forEach(function(r) {
      var b = document.createElement('button');
      b.className = 'room-tab' + (r.name === currentRoom ? ' active' : '');
      b.id = 'tab_' + r.name;
      b.innerHTML = (r.has_password ? '🔒' : '') + esc(roomLabel(r.name));
      b.onclick = function() { enterRoom(r.name); };
      tabs.appendChild(b);
    });
    var list = document.getElementById('roomList');
    list.innerHTML = '';
    rooms.forEach(function(r) {
      var div = document.createElement('div');
      div.className = 'room-item';
      div.innerHTML = '<span>' + esc(roomLabel(r.name)) + ' <span class="lock">' + (r.has_password ? '🔒 有密码' : '🔓') + '</span></span>' +
        '<button class="btn gray" style="margin:0" onclick="enterRoom(\'' + r.name + '\')">进入</button>';
      list.appendChild(div);
    });
  }).catch(function(e) { console.warn(e); });
}

function createRoom() {
  var name = document.getElementById('setRoomName').value.trim();
  var pwd = document.getElementById('setRoomPwd').value;
  if (!name) { toast('请输入房间名'); return; }
  api('/api/rooms', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, password: pwd, creator: userName })
  }).then(function(d) {
    toast('✅ 房间「' + name + '」创建成功');
    document.getElementById('setRoomName').value = '';
    document.getElementById('setRoomPwd').value = '';
    loadRooms();
  }).catch(function(e) { toast('❌ ' + e.message); });
}

function joinRoomByName() {
  var name = document.getElementById('setRoomName').value.trim();
  if (!name) { toast('请输入房间名'); return; }
  enterRoom(name);
}

function deleteRoomByName() {
  var name = document.getElementById('setRoomName').value.trim();
  if (!name) { toast('请输入房间名'); return; }
  var pwd = document.getElementById('setRoomPwd').value;
  if (!confirm('确定删除房间「' + name + '」？此操作不可恢复！')) return;
  api('/api/rooms/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, password: pwd })
  }).then(function() {
    toast('🗑️ 房间已删除');
    if (currentRoom === name) switchRoom('main', '');
    loadRooms();
  }).catch(function(e) { toast('❌ ' + e.message); });
}

// ==================== 设置 ====================
function openSettings() {
  document.getElementById('setName').value = userName;
  document.getElementById('setCurRoom').textContent = roomLabel(currentRoom);
  document.getElementById('settingsMask').classList.add('show');
  loadRooms();
  loadTimeSettings();
  refreshOnline();
}
function closeSettings() { document.getElementById('settingsMask').classList.remove('show'); }

function saveName() {
  var n = document.getElementById('setName').value.trim();
  if (!n) { toast('名字不能为空'); return; }
  userName = n;
  localStorage.setItem('gc_name', n);
  toast('✅ 名字已改为 ' + n);
}

function saveSpeak() {
  speakNames = document.getElementById('setSpeak').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
  speakAll = document.getElementById('speakAll').checked;
  localStorage.setItem('gc_speak', speakNames.join(','));
  localStorage.setItem('gc_speakAll', speakAll ? '1' : '0');
  toast('✅ 朗读设置已保存');
}

function uploadAvatar() {
  var name = document.getElementById('avatarName').value.trim();
  var file = document.getElementById('avatarFile').files[0];
  if (!name) { toast('请输入成员名字'); return; }
  if (!file) { toast('请选择图片'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    api('/api/avatar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, image: e.target.result })
    }).then(function() {
      toast('✅ ' + name + ' 的头像已更新');
      loadAvatars();
    }).catch(function(err) { toast('❌ ' + err.message); });
  };
  reader.readAsDataURL(file);
}

function loadAvatars() {
  api('/api/avatar').then(function(d) {
    avatars = d.avatars || {};
  }).catch(function() {});
}

function loadTimeSettings() {
  api('/api/time_settings?room=' + encodeURIComponent(currentRoom)).then(function(d) {
    var s = d.settings || {};
    document.getElementById('setTimeMode').value = s.mode || 'real';
    document.getElementById('setFixedTime').value = s.fixed_time || '';
  }).catch(function() {});
}

function saveTimeSettings() {
  api('/api/time_settings', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: document.getElementById('setTimeMode').value, fixed_time: document.getElementById('setFixedTime').value, room: currentRoom })
  }).then(function() {
    toast('✅ 时间设置已保存');
  }).catch(function(e) { toast('❌ ' + e.message); });
}

// ==================== 初始化 ====================
function init() {
  document.getElementById('roomName').textContent = roomLabel(currentRoom);
  document.getElementById('roomEmoji').textContent = roomEmoji(currentRoom);
  document.getElementById('setSpeak').value = speakNames.join(',');
  document.getElementById('speakAll').checked = speakAll;
  loadRooms();
  loadAvatars();
  reportRoom();
  restoreCache().then(function() { return loadMessages(false); });
  heartbeat();
  setInterval(function() { loadMessages(true); heartbeat(); }, 3000);
}
init();
