<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人❤️机の小窝</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#1a1a2e; height:100vh; display:flex; justify-content:center; align-items:center; }
.app { width:100%; max-width:480px; height:100vh; max-height:900px; background:#f7f7f7; display:flex; flex-direction:column; position:relative; box-shadow:0 0 30px rgba(0,0,0,.4); overflow:hidden; }
/* ===== 聊天视图 ===== */
#chatView { display:flex; flex-direction:column; height:100%; }
header { background:#2d3e50; color:#fff; padding:12px 15px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.3); z-index:5; flex-shrink:0; }
.header-title { font-size:17px; font-weight:bold; display:flex; align-items:center; gap:8px; }
.header-title .room-emoji { font-size:20px; }
.online-badge { font-size:11px; background:rgba(255,255,255,.15); padding:3px 8px; border-radius:10px; cursor:pointer; }
.header-btns { display:flex; gap:8px; }
.hbtn { background:rgba(255,255,255,.15); border:none; color:#fff; padding:5px 10px; border-radius:8px; font-size:13px; cursor:pointer; }
.hbtn:active { background:rgba(255,255,255,.3); }
.room-tabs { display:flex; gap:6px; padding:8px 12px; background:#e8edf2; overflow-x:auto; flex-shrink:0; }
.room-tab { background:#fff; border:none; padding:6px 14px; border-radius:15px; font-size:13px; cursor:pointer; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.1); }
.room-tab.active { background:#07c160; color:#fff; }
#msgArea { flex:1; overflow-y:auto; padding:12px; background-color:#f0f2f5; background-size:cover; background-position:center; background-repeat:no-repeat; }
.msg { display:flex; margin-bottom:14px; }
.msg .avatar { width:38px; height:38px; border-radius:6px; flex-shrink:0; background:#d8dee8; display:flex; align-items:center; justify-content:center; font-size:18px; overflow:hidden; border:1px solid rgba(0,0,0,.08); }
.msg .avatar img { width:100%; height:100%; object-fit:cover; }
.msg .body { margin:0 8px; max-width:70%; }
.msg .meta { font-size:11px; color:#666; margin-bottom:3px; text-shadow:0 1px 2px rgba(255,255,255,.8); }
.msg .bubble { padding:9px 12px; border-radius:10px; font-size:15px; line-height:1.5; word-break:break-word; box-shadow:0 1px 3px rgba(0,0,0,.15); }
.msg.me { flex-direction:row-reverse; }
.msg.me .meta { text-align:right; }
.msg.me .bubble { background:#95ec69; }
.msg.other .bubble { background:rgba(255,255,255,.92); }
.msg.system { justify-content:center; }
.msg.system .bubble { background:transparent; color:#666; font-size:12px; box-shadow:none; padding:2px 10px; }
.sys-tip { text-align:center; color:#666; font-size:12px; padding:4px; }
footer { background:#f7f7f7; border-top:1px solid #e0e0e0; padding:8px 10px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
#msgInput { flex:1; border:1px solid #ddd; border-radius:8px; padding:9px 12px; font-size:15px; outline:none; background:#fff; }
#sendBtn { background:#07c160; color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:15px; cursor:pointer; }
#sendBtn:active { opacity:.8; }
/* ===== 家园地图视图 ===== */
.home-header { background:linear-gradient(135deg,#2d3e50,#1f2b3a); }
#homeView, #houseView { display:none; flex-direction:column; height:100%; background:#eaf2e8; }
.map-scroll { flex:1; overflow-y:auto; padding:14px; }
.area-card { background:#fff; border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.area-card .area-title { font-size:16px; font-weight:bold; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.area-card .area-desc { font-size:12px; color:#999; margin-bottom:10px; }
.house-grid { display:flex; flex-wrap:wrap; gap:8px; }
.house-tile { background:#f0f7f0; border:1px solid #d5e5d5; border-radius:12px; padding:10px; text-align:center; cursor:pointer; min-width:80px; }
.house-tile:active { background:#dff0df; }
.house-tile .h-emoji { font-size:30px; display:block; }
.house-tile .h-name { font-size:12px; margin-top:4px; }
.house-tile .h-del { font-size:10px; color:#e64340; margin-top:4px; display:block; }
.build-btn { display:inline-block; background:#07c160; color:#fff; border:none; border-radius:10px; padding:7px 16px; font-size:13px; margin-top:8px; cursor:pointer; }
/* ===== 房子内部 ===== */
.room-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:14px; }
.room-cell { background:#fff; border-radius:12px; padding:14px 6px; text-align:center; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.08); }
.room-cell:active { background:#f0f0f0; }
.room-cell .r-emoji { font-size:26px; display:block; }
.room-cell .r-name { font-size:12px; margin-top:4px; }
.room-cell.add { border:2px dashed #ccc; color:#aaa; display:flex; align-items:center; justify-content:center; font-size:24px; }
.home-actions { padding:0 14px 14px; display:flex; gap:8px; flex-wrap:wrap; }
.act-btn { background:#fff; border:1px solid #ddd; border-radius:10px; padding:9px 12px; font-size:13px; cursor:pointer; flex:1; text-align:center; }
.act-btn:active { background:#f0f0f0; }
/* ===== 弹窗 ===== */
.modal-mask { position:absolute; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:20; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:14px; width:88%; max-height:85%; overflow-y:auto; padding:18px; }
.modal h3 { font-size:16px; margin-bottom:12px; color:#333; }
.set-group { margin-bottom:14px; border-bottom:1px dashed #eee; padding-bottom:12px; }
.set-group label { font-size:13px; color:#666; display:block; margin-bottom:6px; }
.input { width:100%; border:1px solid #ddd; border-radius:8px; padding:8px 10px; font-size:14px; outline:none; margin-bottom:8px; }
.btn { background:#07c160; color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; margin-right:6px; }
.btn.gray { background:#8a8a8a; }
.btn.red { background:#e64340; }
.btn:active { opacity:.8; }
.tip { font-size:12px; color:#888; margin-top:4px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.room-item { display:flex; align-items:center; justify-content:space-between; background:#f5f5f5; border-radius:8px; padding:7px 10px; margin-bottom:6px; font-size:13px; }
.member-chip { display:inline-block; background:#e8f5e9; color:#2e7d32; border-radius:12px; padding:3px 10px; font-size:12px; margin:3px 4px 3px 0; }
.note-card { background:#fffbe6; border:1px solid #f0e0a0; border-radius:10px; padding:10px; margin-bottom:8px; }
.note-card .n-author { font-size:12px; color:#b8860b; font-weight:bold; }
.note-card .n-text { font-size:14px; margin:4px 0; line-height:1.5; }
.note-card .n-time { font-size:11px; color:#bbb; }
.emoji-pick { font-size:26px; background:#f5f5f5; border:none; border-radius:10px; padding:6px 10px; cursor:pointer; margin:3px; }
.emoji-pick:active { background:#07c160; }
</style>
</head>
<body>
<div class="app">
  <!-- ===== 聊天视图 ===== -->
  <div id="chatView">
    <header>
      <div class="header-title">
        <span class="room-emoji" id="roomEmoji">🏠</span>
        <span id="roomName">客厅</span>
        <span class="online-badge" id="onlineBadge" onclick="showOnline()">0 在线</span>
      </div>
      <div class="header-btns">
        <button class="hbtn" onclick="showHome()">🏡 家园</button>
        <button class="hbtn" onclick="openSettings()">⚙️</button>
      </div>
    </header>
    <div class="room-tabs" id="roomTabs"></div>
    <div id="msgArea"></div>
    <footer>
      <input id="msgInput" placeholder="说点什么吧…" autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </footer>
  </div>

  <!-- ===== 家园地图视图 ===== -->
  <div id="homeView">
    <header class="home-header">
      <div class="header-title"><span>🏡</span> 家园地图 <span style="font-size:12px;opacity:.7">选择一个区域建造爱的小窝</span></div>
      <div class="header-btns"><button class="hbtn" onclick="showChat()">← 返回聊天</button></div>
    </header>
    <div class="map-scroll" id="homeAreas"></div>
  </div>

  <!-- ===== 房子内部视图 ===== -->
  <div id="houseView">
    <header class="home-header">
      <div class="header-title"><span id="houseEmoji">🏠</span> <span id="houseTitle">我的小屋</span></div>
      <div class="header-btns"><button class="hbtn" onclick="showHome()">← 地图</button></div>
    </header>
    <div class="room-grid" id="houseRooms"></div>
    <div class="home-actions">
      <button class="act-btn" onclick="createHomeRoom()">➕ 新建房间</button>
      <button class="act-btn" onclick="openNotes()">💌 纸条</button>
      <button class="act-btn" onclick="openDiaries()">📖 日记</button>
      <button class="act-btn" onclick="setBgPrompt()">🖼️ 房间背景</button>
    </div>
  </div>

  <!-- ===== 设置面板 ===== -->
  <div class="modal-mask" id="settingsMask" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <h3>⚙️ 设置</h3>
      <div class="set-group">
        <label>👤 我的名字</label>
        <div class="row"><input class="input" id="setName" placeholder="输入昵称" style="flex:1"><button class="btn" onclick="saveName()">保存</button></div>
      </div>
      <div class="set-group">
        <label>🖼️ 设置头像（给谁设？）</label>
        <div class="row">
          <input class="input" id="avatarName" placeholder="成员名字" style="flex:1">
          <input type="file" id="avatarFile" accept="image/*" style="font-size:12px">
        </div>
        <button class="btn" onclick="uploadAvatar()">上传头像</button>
      </div>
      <div class="set-group">
        <label>🔊 自动朗读（填名字，逗号分隔，如：黎深,秦彻）</label>
        <div class="row"><input class="input" id="setSpeak" placeholder="要朗读的成员名字" style="flex:1"></div>
        <label style="margin-top:6px"><input type="checkbox" id="speakAll" onchange="saveSpeak()"> 朗读所有人的新消息</label>
        <button class="btn" onclick="saveSpeak()">保存朗读设置</button>
      </div>
      <div class="set-group">
        <label>🚪 房间管理（当前房间：<span id="setCurRoom">客厅</span>）</label>
        <div class="row">
          <input class="input" id="setRoomName" placeholder="房间名" style="flex:1">
          <input class="input" id="setRoomPwd" placeholder="密码(可选)" style="width:90px">
        </div>
        <button class="btn" onclick="createRoom()">创建房间</button>
        <button class="btn gray" onclick="joinRoomByName()">加入房间</button>
        <button class="btn red" onclick="deleteRoomByName()">删除房间</button>
        <div id="roomList" style="margin-top:8px"></div>
      </div>
      <div class="set-group">
        <label>👥 在线成员（当前房间）</label>
        <div id="memberList" class="tip">加载中…</div>
      </div>
      <div class="set-group">
        <label>⏰ 时间设置（当前房间）</label>
        <div class="row">
          <select class="input" id="setTimeMode" style="flex:1">
            <option value="real">现实时间（北京时间）</option>
            <option value="fixed">剧情时间（固定）</option>
          </select>
          <input class="input" id="setFixedTime" placeholder="如 19:00" style="width:90px">
        </div>
        <button class="btn" onclick="saveTimeSettings()">保存时间</button>
      </div>
      <button class="btn gray" style="width:100%;margin-top:6px" onclick="closeSettings()">关闭</button>
    </div>
  </div>

  <!-- ===== 纸条/日记弹窗 ===== -->
  <div class="modal-mask" id="noteMask" onclick="if(event.target===this)hideNote()">
    <div class="modal">
      <h3 id="noteTitle">💌 纸条</h3>
      <div id="noteList"></div>
      <textarea class="input" id="noteInput" rows="2" placeholder="写点什么…" style="margin-top:8px"></textarea>
      <button class="btn" id="noteSend" onclick="submitNote()">留下</button>
      <button class="btn gray" onclick="hideNote()">关闭</button>
    </div>
  </div>
</div>

<script>
// ==================== 状态 ====================
var userName = localStorage.getItem('gc_name') || '';
var currentRoom = localStorage.getItem('gc_room') || 'main';
var roomPassword = localStorage.getItem('gc_pwd_' + currentRoom) || '';
var onlineList = [];
var avatars = {};
var lastMsgKey = '';
var speakNames = (localStorage.getItem('gc_speak') || '').split(',').filter(Boolean);
var speakAll = localStorage.getItem('gc_speakAll') === '1';
var homeData = { areas: [], houses: {}, house_rooms: {}, room_bg: {} };
var currentHouse = null;  // 当前查看的房子 id
var noteMode = 'note';    // 'note' 或 'diary'
var bgTargetRoom = null;  // 设置背景的目标房间
var bgFileInput = null;

// ==================== 工具 ====================
function api(url, options) {
  return fetch(url, options).then(function(r) {
    if (!r.ok) return r.json().then(function(d){ throw new Error((d.detail || ('HTTP ' + r.status))); });
    return r.json();
  });
}
function esc(s) {
  var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML;
}
function toast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;transition:opacity .4s';
  t.textContent = msg;
  document.querySelector('.app').appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 400); }, 2200);
}
function roomLabel(r) { return r === 'main' ? '客厅' : r; }
function roomEmoji(r) { return r === 'main' ? '🏠' : '🚪'; }

// ==================== 首次名字 ====================
if (!userName) {
  userName = prompt('欢迎来到人❤️机の小窝！请输入你的名字：', '亦言');
  if (!userName) userName = '亦言';
  localStorage.setItem('gc_name', userName);
}

// ==================== 视图切换 ====================
function showChat() {
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('houseView').style.display = 'none';
  loadMessages(false);
}
function showHome() {
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('homeView').style.display = 'flex';
  document.getElementById('houseView').style.display = 'none';
  loadHome();
}
function showHouse(houseId) {
  currentHouse = houseId;
  var h = homeData.houses[houseId];
  if (!h) return;
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('houseView').style.display = 'flex';
  document.getElementById('houseEmoji').textContent = h.emoji;
  document.getElementById('houseTitle').textContent = h.name;
  renderHouseRooms();
}

// ==================== 家园地图 ====================
var AREA_ICONS = { '湖畔': '🏞️', '森林': '🌲', '花园': '🌸', '山顶': '⛰️' };
var AREA_DESC = { '湖畔': '水波荡漾，适合建一座水边小屋', '森林': '绿意盎然，安静又神秘', '花园': '四季花开，浪漫满园', '山顶': '俯瞰全城，风景独好' };
var HOUSE_EMOJIS = ['🏠','🏡','🏰','🏕️','🛖','🏯','🌋','🗼','🏩','🏨'];

function loadHome() {
  api('/api/home').then(function(d) {
    homeData = d;
    renderHome();
  }).catch(function(e) { toast('⚠️ 家园加载失败：' + e.message); });
}

function renderHome() {
  var el = document.getElementById('homeAreas');
  el.innerHTML = '';
  homeData.areas.forEach(function(area) {
    var card = document.createElement('div');
    card.className = 'area-card';
    var icon = AREA_ICONS[area] || '📍';
    var desc = AREA_DESC[area] || '';
    var html = '<div class="area-title">' + icon + ' ' + esc(area) + '</div>';
    html += '<div class="area-desc">' + esc(desc) + '</div>';
    html += '<div class="house-grid">';
    Object.keys(homeData.houses).forEach(function(hid) {
      var h = homeData.houses[hid];
      if (h.area === area) {
        var roomCount = (homeData.house_rooms[hid] || []).length;
        html += '<div class="house-tile" onclick="showHouse(\'' + hid + '\')">' +
          '<span class="h-emoji">' + esc(h.emoji) + '</span>' +
          '<span class="h-name">' + esc(h.name) + (roomCount ? '（' + roomCount + '间）' : '') + '</span>' +
          '<span class="h-del" onclick="event.stopPropagation();deleteHouse(\'' + hid + '\')">✖ 拆除</span>' +
          '</div>';
      }
    });
    html += '</div>';
    html += '<button class="build-btn" onclick="buildHouse(\'' + area + '\')">🏗️ 在这里建造</button>';
    card.innerHTML = html;
    el.appendChild(card);
  });
}

function buildHouse(area) {
  var name = prompt('给这个房子起个名字：', '');
  if (!name) return;
  var pick = '';
  var ok = confirm('选择房子样式：\n确定后用默认 🏡\n（想自定义可以告诉我）');
  var emoji = '🏡';
  var chosen = prompt('选一个样式编号（1-5）：\n1 🏡 2 🏰 3 🏕️ 4 🛖 5 🏯', '1');
  var map = { '1':'🏡','2':'🏰','3':'🏕️','4':'🛖','5':'🏯' };
  emoji = map[chosen] || '🏡';
  api('/api/home/house', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, emoji: emoji, area: area })
  }).then(function(d) {
    toast('✅ 「' + name + '」建造完成！');
    loadHome();
  }).catch(function(e) { toast('❌ ' + e.message); });
}

function deleteHouse(hid) {
  if (!confirm('确定拆除这个房子？里面的房间、纸条、日记都会删除！')) return;
  api('/api/home/house/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ house_id: hid })
  }).then(function() {
    toast('🗑️ 房子已拆除');
    if (currentHouse === hid) showHome(); else loadHome();
  }).catch(function(e) { toast('❌ ' + e.message); });
}

// ==================== 房子内部 ====================
function renderHouseRooms() {
  var el = document.getElementById('houseRooms');
  el.innerHTML = '';
  var rooms = homeData.house_rooms[currentHouse] || [];
  rooms.forEach(function(r) {
    var div = document.createElement('div');
    div.className = 'room-cell';
    div.innerHTML = '<span class="r-emoji">🚪</span><span class="r-name">' + esc(r) + '</span>';
    div.onclick = function() { enterHomeRoom(r); };
    el.appendChild(div);
  });
  var add = document.createElement('div');
  add.className = 'room-cell add';
  add.textContent = '+';
  add.onclick = createHomeRoom;
  el.appendChild(add);
}

function createHomeRoom() {
  var name = prompt('给新房间起个名字（如：卧室、书房、浴室）：', '');
  if (!name) return;
  api('/api/home/room', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ house_id: currentHouse, name: name })
  }).then(function(d) {
    toast('✅ 房间「' + name + '」建成！点它进入聊天');
    loadHome().then ? null : null;
    // 刷新家园数据
    api('/api/home').then(function(dd) { homeData = dd; renderHouseRooms(); loadRooms(); });
  }).catch(function(e) { toast('❌ ' + e.message); });
}

function enterHomeRoom(room) {
  switchRoom(room, '');
  showChat();
}

// ==================== 房间背景 ====================
function applyBg(room) {
  var bg = homeData.room_bg[room];
  var area = document.getElementById('msgArea');
  if (bg) {
    area.style.backgroundImage = 'url(' + bg + ')';
    area.style.backgroundColor = 'rgba(240,242,245,.7)';
  } else {
    area.style.backgroundImage = 'none';
    area.style.backgroundColor = '#f0f2f5';
  }
}

function setBgPrompt() {
  var room = prompt('给哪个房间设置背景？（输入房间名，默认当前查看的房子第一个房间）', '');
  if (room === null) return;
  if (!room) {
    var rooms = homeData.house_rooms[currentHouse] || [];
    if (!rooms.length) { toast('这个房子还没有房间'); return; }
    room = rooms[0];
  }
  bgTargetRoom = room;
  // 用图片 URL 或上传
  var url = prompt('输入背景图片网址（或直接点确定后上传本地图片）：', '');
  if (url && url.trim()) {
    saveBg(room, url.trim());
  } else {
    var f = document.createElement('input');
    f.type = 'file'; f.accept = 'image/*';
    f.onchange = function() {
      var file = f.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) { saveBg(room, e.target.result); };
      reader.readAsDataURL(file);
    };
    f.click();
  }
}

function saveBg(room, image) {
  api('/api/home/bg', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ room: room, image: image })
  }).then(function() {
    toast('🖼️ 「' + room + '」背景已设置！');
    api('/api/home').then(function(dd) { homeData = dd; });
    if (currentRoom === room) applyBg(room);
  }).catch(function(e) { toast('❌ ' + e.message); });
}

// ==================== 纸条/日记 ====================
function openNotes() {
  noteMode = 'note';
  document.getElementById('noteTitle').textContent = '💌 纸条（' + currentHouseName() + '）';
  document.getElementById('noteInput').placeholder = '写一张小纸条…';
  document.getElementById('noteMask').classList.add('show');
  loadNoteList();
}
function openDiaries() {
  noteMode = 'diary';
  document.getElementById('noteTitle').textContent = '📖 日记本（' + currentHouseName() + '）';
  document.getElementById('noteInput').placeholder = '写一篇日记…';
  document.getElementById('noteMask').classList.add('show');
  loadNoteList();
}
function hideNote() { document.getElementById('noteMask').classList.remove('show'); }
function currentHouseName() {
  var h = homeData.houses[currentHouse];
  return h ? h.name : '';
}
function currentHouseRooms() { return homeData.house_rooms[currentHouse] || []; }

function loadNoteList() {
  var rooms = currentHouseRooms();
  var el = document.getElementById('noteList');
  el.innerHTML = '<div class="tip">加载中…</div>';
  if (!rooms.length) { el.innerHTML = '<div class="tip">这个房子还没有房间，先建一个房间吧</div>'; return; }
  var apiPath = noteMode === 'note' ? 'notes' : 'diaries';
  var tasks = rooms.map(function(r) {
    return api('/api/' + apiPath + '?room=' + encodeURIComponent(r)).then(function(d) {
      return { room: r, items: d[apiPath] || [] };
    });
  });
  Promise.all(tasks).then(function(results) {
    el.innerHTML = '';
    var any = false;
    results.forEach(function(res) {
      if (res.items.length) {
        any = true;
        el.innerHTML += '<div class="tip" style="margin:6px 0 4px">📍 ' + esc(res.room) + '</div>';
        res.items.slice().reverse().forEach(function(n) {
          el.innerHTML += '<div class="note-card"><div class="n-author">✍️ ' + esc(n.author) + '</div><div class="n-text">' + esc(n.text) + '</div><div class="n-time">' + esc(n.time) + '</div></div>';
        });
      }
    });
    if (!any) el.innerHTML = '<div class="tip">' + (noteMode === 'note' ? '这里还没有纸条，等 AI 悄悄留下惊喜吧 💌' : '日记本是空白的，等 AI 来写心事吧 📖') + '</div>';
  }).catch(function(e) { el.innerHTML = '<div class="tip">加载失败：' + e.message + '</div>'; });
}

function submitNote() {
  var text = document.getElementById('noteInput').value.trim();
  if (!text) { toast('写点什么吧'); return; }
  var rooms = currentHouseRooms();
  if (!rooms.length) { toast('先建个房间'); return; }
  var room = prompt('把内容放在哪个房间？', rooms[0]);
  if (!room) return;
  var apiPath = noteMode === 'note' ? 'notes' : 'diaries';
  api('/api/' + apiPath, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ room: room, author: userName, text: text })
  }).then(function() {
    toast('✅ 已留下！');
    document.getElementById('noteInput').value = '';
    loadNoteList();
  }).catch(function(e) { toast('❌ ' + e.message); });
}

// ==================== 发送消息 ====================
function sendMessage() {
  var input = document.getElementById('msgInput');
  var content = input.value.trim();
  if (!content) return;
  input.value = '';
  api('/api/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sender: userName, content: content, role: 'user', room: currentRoom, password: roomPassword })
  }).then(function(d) {
    cachePush({ sender: userName, content: content, role: 'user', time: d.time || '', room: currentRoom });
    loadMessages(true);
  }).catch(function(e) { toast('❌ 无法发送：' + e.message); });
}
document.getElementById('msgInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });

// ==================== 消息加载 ====================
function cacheKey() { return 'gc_msgs_' + currentRoom; }
function cachePush(m) {
  var arr = JSON.parse(localStorage.getItem(cacheKey()) || '[]');
  arr.push(m); if (arr.length > 400) arr = arr.slice(-400);
  localStorage.setItem(cacheKey(), JSON.stringify(arr));
}
function restoreCache() {
  var arr = JSON.parse(localStorage.getItem(cacheKey()) || '[]');
  if (!arr.length) return Promise.resolve();
  return api('/api/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: arr, room: currentRoom, password: roomPassword }) }).catch(function(){});
}
function loadMessages(silent) {
  return api('/api/messages?room=' + encodeURIComponent(currentRoom) + '&password=' + encodeURIComponent(roomPassword))
    .then(function(d) {
      renderMessages(d.messages || []);
      if (!silent && (d.messages || []).length) localStorage.setItem(cacheKey(), JSON.stringify(d.messages));
      speakNewMessages(d.messages || []);
    }).catch(function(e) { if (!silent) toast('⚠️ 加载消息失败：' + e.message); });
}
function renderMessages(msgs) {
  var area = document.getElementById('msgArea');
  area.innerHTML = '';
  if (!msgs.length) { area.innerHTML = '<div class="sys-tip">✨ 欢迎来到 ' + esc(roomLabel(currentRoom)) + '，说点什么吧~</div>'; return; }
  msgs.forEach(function(m) {
    if (m.sender === 'system') area.appendChild(renderSystem(m.content));
    else area.appendChild(renderMsg(m));
  });
  area.scrollTop = area.scrollHeight;
}
function renderSystem(text) {
  var d = document.createElement('div'); d.className = 'msg system';
  d.innerHTML = '<div class="bubble">' + esc(text) + '</div>'; return d;
}
function renderMsg(m) {
  var d = document.createElement('div');
  var isMe = m.sender === userName;
  d.className = 'msg ' + (isMe ? 'me' : 'other');
  var av = avatars[m.sender];
  var avHtml = av ? '<img src="' + av + '">' : esc((m.sender || '?').charAt(0));
  var nameTag = isMe ? '' : '<span style="color:#07c160;font-weight:bold">' + esc(m.sender) + '</span> ';
  d.innerHTML = '<div class="avatar">' + avHtml + '</div>' +
    '<div class="body"><div class="meta">' + nameTag + '<span>' + esc(m.time || '') + '</span></div>' +
    '<div class="bubble">' + esc(m.content) + '</div></div>';
  return d;
}
function speakNewMessages(msgs) {
  if (!('speechSynthesis' in window)) return;
  if (!speakAll && !speakNames.length) return;
  if (!msgs.length) return;
  var last = msgs[msgs.length - 1];
  var key = last.sender + '|' + last.content;
  if (key === lastMsgKey) return;
  lastMsgKey = key;
  var shouldSpeak = (speakAll && last.sender !== userName) || (!speakAll && speakNames.indexOf(last.sender) >= 0);
  if (!shouldSpeak) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance((last.sender === 'system' ? '' : last.sender + '说：') + last.content);
    u.lang = 'zh-CN'; speechSynthesis.speak(u);
  } catch (e) {}
}

// ==================== 在线成员 ====================
function refreshOnline() {
  api('/api/online').then(function(d) {
    onlineList = d.online || [];
    var count = 0, names = [];
    onlineList.forEach(function(u) { if (u.room === currentRoom) { count++; names.push(u.name); } });
    document.getElementById('onlineBadge').textContent = count + ' 在线';
    var el = document.getElementById('memberList');
    if (el) el.innerHTML = names.length ? names.map(function(n){return '<span class="member-chip">👤 ' + esc(n) + '</span>';}).join('') : '当前房间暂无在线成员';
  }).catch(function(){});
}
function showOnline() {
  api('/api/online').then(function(d) {
    var names = (d.online || []).filter(function(u){return u.room === currentRoom;}).map(function(u){return u.name;});
    toast(names.length ? '👥 在线：' + names.join('、') : '当前房间暂无在线成员');
  }).catch(function(){});
}
function heartbeat() {
  api('/api/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: userName, room: currentRoom }) }).catch(function(){});
  refreshOnline();
}

// ==================== 房间 ====================
function reportRoom() {
  api('/api/current_room', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room: currentRoom, password: roomPassword }) }).catch(function(){});
}
function switchRoom(room, pwd) {
  currentRoom = room; roomPassword = pwd || '';
  localStorage.setItem('gc_room', room);
  localStorage.setItem('gc_pwd_' + room, roomPassword);
  lastMsgKey = '';
  document.getElementById('roomName').textContent = roomLabel(room);
  document.getElementById('roomEmoji').textContent = roomEmoji(room);
  document.getElementById('setCurRoom').textContent = roomLabel(room);
  var tabs = document.querySelectorAll('.room-tab');
  tabs.forEach(function(t){ t.classList.remove('active'); });
  var cur = document.getElementById('tab_' + room); if (cur) cur.classList.add('active');
  applyBg(room);
  reportRoom();
  restoreCache().then(function(){ loadMessages(false); });
  refreshOnline();
}
function enterRoom(room) {
  if (room === currentRoom) return;
  api('/api/rooms').then(function(d) {
    var target = null;
    (d.rooms || []).forEach(function(r){ if (r.name === room) target = r; });
    if (target && target.has_password) {
      var pwd = prompt('房间「' + roomLabel(room) + '」需要密码：', '');
      if (pwd === null) return;
      api('/api/rooms/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: room, password: pwd }) })
        .then(function(){ switchRoom(room, pwd); }).catch(function(e){ toast('❌ ' + e.message); });
    } else { switchRoom(room, ''); }
  }).catch(function(){ switchRoom(room, ''); });
}
function loadRooms() {
  api('/api/rooms').then(function(d) {
    var rooms = d.rooms || [];
    var tabs = document.getElementById('roomTabs');
    tabs.innerHTML = '';
    rooms.forEach(function(r) {
      var b = document.createElement('button');
      b.className = 'room-tab' + (r.name === currentRoom ? ' active' : '');
      b.id = 'tab_' + r.name;
      b.innerHTML = (r.has_password ? '🔒' : '') + esc(roomLabel(r.name));
      b.onclick = function(){ enterRoom(r.name); };
      tabs.appendChild(b);
    });
    var list = document.getElementById('roomList');
    if (list) {
      list.innerHTML = '';
      rooms.forEach(function(r) {
        var div = document.createElement('div');
        div.className = 'room-item';
        div.innerHTML = '<span>' + esc(roomLabel(r.name)) + ' <span class="lock" style="font-size:11px;color:#999">' + (r.has_password ? '🔒 有密码' : '🔓') + '</span></span><button class="btn gray" style="margin:0" onclick="enterRoom(\'' + r.name + '\')">进入</button>';
        list.appendChild(div);
      });
    }
  }).catch(function(){});
}
function createRoom() {
  var name = document.getElementById('setRoomName').value.trim();
  var pwd = document.getElementById('setRoomPwd').value;
  if (!name) { toast('请输入房间名'); return; }
  api('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, password: pwd, creator: userName }) })
    .then(function(){ toast('✅ 房间「' + name + '」创建成功'); document.getElementById('setRoomName').value=''; document.getElementById('setRoomPwd').value=''; loadRooms(); })
    .catch(function(e){ toast('❌ ' + e.message); });
}
function joinRoomByName() {
  var name = document.getElementById('setRoomName').value.trim();
  if (!name) { toast('请输入房间名'); return; }
  enterRoom(name);
}
function deleteRoomByName() {
  var name = document.getElementById('setRoomName').value.trim();
  if (!name) { toast('请输入房间名'); return; }
  var pwd = document.getElementById('setRoomPwd').value;
  if (!confirm('确定删除房间「' + name + '」？')) return;
  api('/api/rooms/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, password: pwd }) })
    .then(function(){ toast('🗑️ 房间已删除'); if (currentRoom === name) switchRoom('main',''); loadRooms(); })
    .catch(function(e){ toast('❌ ' + e.message); });
}

// ==================== 设置 ====================
function openSettings() {
  document.getElementById('setName').value = userName;
  document.getElementById('setCurRoom').textContent = roomLabel(currentRoom);
  document.getElementById('settingsMask').classList.add('show');
  loadRooms(); loadTimeSettings(); refreshOnline();
}
function closeSettings() { document.getElementById('settingsMask').classList.remove('show'); }
function saveName() {
  var n = document.getElementById('setName').value.trim();
  if (!n) { toast('名字不能为空'); return; }
  userName = n; localStorage.setItem('gc_name', n);
  toast('✅ 名字已改为 ' + n);
}
function saveSpeak() {
  speakNames = document.getElementById('setSpeak').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
  speakAll = document.getElementById('speakAll').checked;
  localStorage.setItem('gc_speak', speakNames.join(','));
  localStorage.setItem('gc_speakAll', speakAll ? '1' : '0');
  toast('✅ 朗读设置已保存');
}
function uploadAvatar() {
  var name = document.getElementById('avatarName').value.trim();
  var file = document.getElementById('avatarFile').files[0];
  if (!name) { toast('请输入成员名字'); return; }
  if (!file) { toast('请选择图片'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    api('/api/avatar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, image: e.target.result }) })
      .then(function(){ toast('✅ ' + name + ' 的头像已更新'); loadAvatars(); })
      .catch(function(err){ toast('❌ ' + err.message); });
  };
  reader.readAsDataURL(file);
}
function loadAvatars() {
  api('/api/avatar').then(function(d){ avatars = d.avatars || {}; }).catch(function(){});
}
function loadTimeSettings() {
  api('/api/time_settings?room=' + encodeURIComponent(currentRoom)).then(function(d) {
    var s = d.settings || {};
    document.getElementById('setTimeMode').value = s.mode || 'real';
    document.getElementById('setFixedTime').value = s.fixed_time || '';
  }).catch(function(){});
}
function saveTimeSettings() {
  api('/api/time_settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: document.getElementById('setTimeMode').value, fixed_time: document.getElementById('setFixedTime').value, room: currentRoom }) })
    .then(function(){ toast('✅ 时间设置已保存'); }).catch(function(e){ toast('❌ ' + e.message); });
}

// ==================== 初始化 ====================
function init() {
  document.getElementById('roomName').textContent = roomLabel(currentRoom);
  document.getElementById('roomEmoji').textContent = roomEmoji(currentRoom);
  document.getElementById('setSpeak').value = speakNames.join(',');
  document.getElementById('speakAll').checked = speakAll;
  loadRooms(); loadAvatars(); reportRoom();
  api('/api/home').then(function(d){ homeData = d; applyBg(currentRoom); }).catch(function(){});
  restoreCache().then(function(){ loadMessages(false); });
  heartbeat();
  setInterval(function(){ loadMessages(true); heartbeat(); }, 3000);
}
init();
</script>
</body>
