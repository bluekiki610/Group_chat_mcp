<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>人❤️机の小窝 · 临空市 v46</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#070b14; height:100vh; height:100dvh; display:flex; justify-content:center; align-items:center; overflow:hidden; }
.app { width:100%; max-width:480px; height:100vh; height:100dvh; max-height:900px; background:#0d1424; display:flex; flex-direction:column; position:relative; overflow:hidden; }
#chatView { display:flex; flex-direction:column; height:100%; }
header { background:linear-gradient(135deg,#12213a,#0b1526); color:#fff; padding:12px 15px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:1px solid rgba(80,180,255,.2); }
.header-title { font-size:17px; font-weight:bold; display:flex; align-items:center; gap:8px; }
.online-badge { font-size:11px; background:rgba(80,180,255,.2); padding:3px 8px; border-radius:10px; cursor:pointer; border:1px solid rgba(80,180,255,.3); }
.header-btns { display:flex; gap:8px; }
.hbtn { background:rgba(80,180,255,.15); border:1px solid rgba(80,180,255,.3); color:#9fd8ff; padding:5px 10px; border-radius:8px; font-size:13px; cursor:pointer; }
.room-desc-bar { background:#0a1424; border-bottom:1px solid rgba(80,180,255,.12); padding:6px 14px; display:flex; align-items:center; gap:6px; flex-shrink:0; }
.room-desc-bar .rd-text { flex:1; font-size:12px; color:#7fa8cf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.room-desc-bar .rd-edit { font-size:11px; color:#7fd0ff; cursor:pointer; flex-shrink:0; }
.room-tabs { display:flex; gap:6px; padding:8px 12px; background:#0d1a2e; overflow-x:auto; flex-shrink:0; }
.room-tab { background:#13233d; border:1px solid rgba(80,180,255,.15); color:#cfe8ff; padding:6px 14px; border-radius:15px; font-size:13px; cursor:pointer; white-space:nowrap; }
.room-tab.active { background:#0e7fd4; color:#fff; }
#msgArea { flex:1; overflow-y:auto; padding:12px; background-color:#0f1a2e; background-size:cover; background-position:center; background-repeat:no-repeat; }
.msg { display:flex; margin-bottom:14px; }
.msg .avatar { width:38px; height:38px; border-radius:6px; flex-shrink:0; background:#1d3150; display:flex; align-items:center; justify-content:center; font-size:18px; overflow:hidden; }
.msg .avatar img { width:100%; height:100%; object-fit:cover; }
.msg .body { margin:0 8px; max-width:70%; }
.msg .meta { font-size:11px; color:#7fa8cf; margin-bottom:3px; }
.msg .bubble { padding:9px 12px; border-radius:10px; font-size:15px; line-height:1.5; word-break:break-word; }
.msg.me { flex-direction:row-reverse; }
.msg.me .meta { text-align:right; }
.msg.system { justify-content:center; }
.msg.system .bubble { background:transparent; color:#6d8bb0; font-size:12px; box-shadow:none; padding:2px 10px; }
.sys-tip { text-align:center; color:#6d8bb0; font-size:12px; padding:4px; }
footer { background:#0d1a2e; border-top:1px solid rgba(80,180,255,.15); padding:8px 10px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
#msgInput { flex:1; border:1px solid #1d3a5f; border-radius:8px; padding:9px 12px; font-size:15px; outline:none; background:#13233d; color:#e6f1ff; }
#sendBtn { background:#0e7fd4; color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:15px; }
.map-view { display:none; flex-direction:column; height:100%; background:#070d18; }
.map-top { position:relative; z-index:30; background:linear-gradient(135deg,#12213a,#0b1526); color:#9fd8ff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:1px solid rgba(80,180,255,.2); }
.map-top .title { font-size:16px; font-weight:bold; color:#fff; display:flex; align-items:center; gap:8px; }
.map-stage { flex:1; position:relative; overflow:hidden; background:#070d18; touch-action:none; }
#mapCanvas, #regionCanvas { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
#mapCanvas img, #regionCanvas img { display:block; width:100%; height:auto; pointer-events:none; user-select:none; -webkit-user-drag:none; }
.holo { position:absolute; transform:translate(-50%,-50%); cursor:pointer; text-align:center; z-index:10; }
.holo .core { display:inline-block; font-size:26px; line-height:1; filter:drop-shadow(0 0 8px var(--glow,#4dd2ff)); animation:floaty 2.4s ease-in-out infinite; }
.holo .lbl { display:block; margin-top:2px; font-size:11px; color:#d8f4ff; background:rgba(6,18,38,.82); border:1px solid var(--bord,#4dd2ff88); border-radius:8px; padding:2px 8px; white-space:nowrap; box-shadow:0 0 12px rgba(77,210,255,.25), inset 0 0 6px rgba(77,210,255,.08); letter-spacing:.5px; }
.holo.region .core { color:#ffd166; --glow:#ffd166; --bord:#ffd16688; }
.holo.home .core { color:#4dd2ff; --glow:#4dd2ff; --bord:#4dd2ff88; }
.holo.home .lbl { border-color:#4dd2ff88; }
.holo.npc .core { color:#c77dff; --glow:#c77dff; --bord:#c77dff88; }
.holo.npc .lbl { border-color:#c77dff88; }
.holo.homepink .core { color:#ff7ab8; --glow:#ff7ab8; --bord:#ff7ab8aa; }
@keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
.holo.selected { outline:2px dashed #ffd166; outline-offset:5px; border-radius:12px; }
.map-bar { position:relative; z-index:30; display:flex; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(10,20,38,.96); border-top:1px solid rgba(80,180,255,.25); flex-shrink:0; backdrop-filter:blur(8px); }
.map-bar .bar-btn { flex:1; background:rgba(80,180,255,.12); border:1px solid rgba(80,180,255,.35); color:#bfe6ff; padding:9px 0; border-radius:12px; font-size:13px; cursor:pointer; text-align:center; }
.map-bar .bar-btn:active { background:#0e7fd4; color:#fff; }
.map-bar .bar-btn.on { background:#0e7fd4; color:#fff; border-color:#0e7fd4; }
.place-hint { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:40; background:rgba(14,127,212,.95); color:#fff; padding:7px 16px; border-radius:20px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.5); display:flex; align-items:center; gap:10px; }
.place-hint .cancel { color:#fff; font-weight:bold; }
.sheet-mask { position:absolute; inset:0; background:rgba(0,0,0,.45); display:none; z-index:50; }
.sheet-mask.show { display:block; }
.sheet { position:absolute; left:0; right:0; bottom:0; background:#101d33; border-top:1px solid rgba(80,180,255,.3); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); z-index:51; animation:slideup .2s ease; }
@keyframes slideup { from{ transform:translateY(60px); opacity:.4;} to{ transform:translateY(0); opacity:1;} }
.sheet .s-title { font-size:14px; color:#9fd8ff; margin-bottom:12px; font-weight:bold; }
.sheet .s-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.sheet .s-item { background:#13233d; border:1px solid rgba(80,180,255,.25); border-radius:12px; padding:12px 8px; text-align:center; cursor:pointer; }
.sheet .s-item:active { background:#0e7fd4; }
.sheet .s-item .ic { font-size:24px; display:block; }
.sheet .s-item .nm { font-size:12px; color:#cfe8ff; margin-top:4px; display:block; }
.sheet .s-close { display:block; width:100%; margin-top:12px; background:#1a2c4a; border:none; color:#7fa8cf; padding:9px; border-radius:10px; font-size:13px; }
.style-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-height:48vh; overflow-y:auto; }
.style-item { background:#13233d; border:1px solid rgba(80,180,255,.25); border-radius:10px; padding:10px 4px; text-align:center; cursor:pointer; font-size:22px; }
.style-item:active { background:#0e7fd4; }
.style-item .st { font-size:10px; color:#7fa8cf; display:block; margin-top:2px; }
.building-view { display:none; flex-direction:column; height:100%; background:#0d1424; }
.bv-body { flex:1; overflow-y:auto; padding:14px; }
.bchat-wrap { height:38%; border-top:1px solid rgba(80,180,255,.25); display:flex; flex-direction:column; flex-shrink:0; }
.bchat-head { display:flex; align-items:center; gap:6px; padding:6px 12px; background:#0a1424; border-bottom:1px solid rgba(80,180,255,.12); flex-shrink:0; }
.bchat-head b { font-size:12px; color:#ffd166; flex:1; }
.bchat-list { flex:1; overflow-y:auto; padding:8px; background:#0f1a2e; }
.bchat-bar { display:flex; gap:6px; padding:6px 10px; background:#0d1a2e; flex-shrink:0; }
.bchat-bar input { flex:1; border:1px solid #1d3a5f; border-radius:8px; padding:7px 10px; font-size:14px; outline:none; background:#13233d; color:#e6f1ff; }
.room-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.room-cell { background:#13233d; border:1px solid rgba(80,180,255,.2); border-radius:12px; padding:14px 6px; text-align:center; cursor:pointer; }
.room-cell:active { background:#0e7fd4; }
.room-cell .r-emoji { font-size:26px; display:block; }
.room-cell .r-name { font-size:12px; margin-top:4px; color:#cfe8ff; word-break:break-all; }
.room-cell.hall { border-color:#ffd16666; background:#1a2a1a; }
.room-cell.locked { border-color:#ff6b6b66; }
.room-cell .r-lock { font-size:11px; color:#ff8a80; display:block; margin-top:2px; }
.room-cell .r-hall { font-size:11px; color:#ffd166; display:block; margin-top:2px; }
.room-cell.add { border:2px dashed #2a4a75; color:#4a729f; display:flex; align-items:center; justify-content:center; font-size:24px; }
.section-title { font-size:15px; color:#9fd8ff; font-weight:bold; margin:12px 0 8px; display:flex; align-items:center; gap:6px; }
.npc-card { background:#13233d; border:1px solid rgba(80,180,255,.2); border-radius:10px; padding:10px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
.npc-card .n-emoji { font-size:28px; }
.npc-card .n-name { color:#fff; font-weight:bold; }
.npc-card .n-desc { color:#7fa8cf; font-size:12px; margin-top:2px; }
.npc-card .n-del { color:#ff6b6b; font-size:11px; margin-left:auto; cursor:pointer; }
.story-card { background:#13233d; border:1px solid rgba(80,180,255,.2); border-radius:10px; padding:10px; margin-bottom:8px; }
.story-card .s-time { font-size:11px; color:#6d8bb0; }
.story-card .s-author { font-size:12px; color:#ffd166; font-weight:bold; }
.story-card .s-text { color:#e6f1ff; font-size:14px; margin-top:4px; line-height:1.6; white-space:pre-wrap; }
.home-actions { display:flex; gap:8px; flex-wrap:wrap; }
.act-btn { background:#13233d; border:1px solid rgba(80,180,255,.3); border-radius:10px; padding:9px 10px; font-size:13px; cursor:pointer; color:#cfe8ff; flex:1; text-align:center; min-width:44%; }
.act-btn:active { background:#0e7fd4; color:#fff; }
.req-card { background:#14283f; border:1px solid rgba(255,200,80,.3); border-radius:10px; padding:10px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.req-card .q-name { color:#ffd166; font-weight:bold; flex:1; }
.req-card .q-time { font-size:11px; color:#6d8bb0; }
.modal-mask { position:absolute; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:60; }
.modal-mask.show { display:flex; }
.modal { background:#101d33; border:1px solid rgba(80,180,255,.3); border-radius:14px; width:88%; max-height:85%; overflow-y:auto; padding:18px; }
.modal h3 { font-size:16px; margin-bottom:12px; color:#fff; }
.set-group { margin-bottom:14px; border-bottom:1px dashed #1d3a5f; padding-bottom:12px; }
.set-group label { font-size:13px; color:#7fa8cf; display:block; margin-bottom:6px; }
.input, select.input { width:100%; border:1px solid #1d3a5f; border-radius:8px; padding:8px 10px; font-size:14px; outline:none; margin-bottom:8px; background:#13233d; color:#e6f1ff; }
textarea.input { color:#e6f1ff; }
.btn { background:#0e7fd4; color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; margin-right:6px; }
.btn.gray { background:#2a4a75; }
.btn.green { background:#0e9f6e; }
.btn:active { opacity:.8; }
.tip { font-size:12px; color:#6d8bb0; margin-top:4px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.note-card { background:#14283f; border:1px solid rgba(255,200,80,.3); border-radius:10px; padding:10px; margin-bottom:8px; }
.note-card .n-author { font-size:12px; color:#ffd166; font-weight:bold; }
.note-card .n-text { font-size:14px; margin:4px 0; line-height:1.5; color:#fff; }
.note-card .n-time { font-size:11px; color:#6d8bb0; }
.note-card .n-reply { background:#12365c; border-radius:8px; padding:6px 8px; margin-top:6px; font-size:13px; color:#9fd8ff; }
.note-card .n-rep-btn { font-size:11px; color:#7fd0ff; cursor:pointer; margin-left:6px; }
.pair-item { background:#13233d; border:1px solid rgba(80,180,255,.25); border-radius:10px; padding:8px 10px; margin-bottom:6px; display:flex; align-items:center; gap:8px; font-size:13px; color:#cfe8ff; }
.pair-item .p-color { width:16px; height:16px; border-radius:4px; flex-shrink:0; }
.pair-item .p-del { color:#ff6b6b; margin-left:auto; cursor:pointer; }
.color-opt { display:inline-flex; align-items:center; gap:4px; background:#13233d; border:1px solid rgba(80,180,255,.3); border-radius:8px; padding:5px 8px; margin:3px; cursor:pointer; font-size:12px; color:#cfe8ff; }
.color-opt.sel { border-color:#0e7fd4; background:#0e7fd4; color:#fff; }
.color-opt .c { width:12px; height:12px; border-radius:3px; }
.priv-tab { display:flex; gap:8px; margin-bottom:10px; }
.priv-tab button { flex:1; background:#13233d; border:1px solid rgba(80,180,255,.3); color:#9fd8ff; padding:8px 0; border-radius:10px; font-size:13px; cursor:pointer; }
.priv-tab button.on { background:#0e7fd4; color:#fff; }
/* 微信风格短信 */
.sms-wrap { background:#ededed; border-radius:10px; padding:10px; max-height:45vh; overflow-y:auto; }
.sms-row { display:flex; margin-bottom:10px; }
.sms-row.mine { justify-content:flex-end; }
.sms-row .sms-bubble { max-width:78%; padding:8px 12px; border-radius:8px; font-size:15px; line-height:1.5; word-break:break-word; }
.sms-row.mine .sms-bubble { background:#95ec69; color:#000; border-top-right-radius:2px; }
.sms-row.them .sms-bubble { background:#fff; color:#000; border-top-left-radius:2px; }
.sms-row .sms-time { font-size:10px; color:#999; margin:0 6px; align-self:flex-end; }
</style>
</head>
<body>
<div class="app">
  <div id="chatView">
    <header>
      <div class="header-title"><button class="hbtn" onclick="goBackFromChat()" style="margin-right:6px;padding:3px 9px">←</button> <span id="roomEmoji">🏠</span> <span id="roomName">公共大厅</span> <span class="online-badge" id="onlineBadge" onclick="showOnline()">0 在线</span></div>
      <div class="header-btns">
        <button class="hbtn" id="privBtn" onclick="togglePrivate()" style="display:none">🏠 私人空间</button>
        <button class="hbtn" onclick="showMap()">🗺️ 地图</button>
        <button class="hbtn" onclick="openSettings()">⚙️</button>
      </div>
    </header>
    <div class="room-desc-bar" id="roomDescBar" style="display:none">
      <span class="rd-text" id="roomDescText"></span>
      <span class="rd-edit" id="roomDescEdit" onclick="editRoomDesc()" style="display:none">✏️</span>
      <span style="cursor:pointer;flex-shrink:0;margin-left:8px" onclick="setRoomBgHere()" title="设置房间背景">🖼️</span>
    </div>
    <div class="room-tabs" id="roomTabs"></div>
    <div id="msgArea"></div>
    <footer>
      <button class="hbtn" id="privFooterBtn" onclick="togglePrivate()" style="display:none;flex-shrink:0">🏠</button>
      <button class="hbtn" onclick="openSms()" style="flex-shrink:0" title="短信">📩<span id="smsDot" style="display:none;color:#ff6b6b;margin-left:2px">●</span></button>
      <input id="msgInput" placeholder="说点什么吧…" autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </footer>
  </div>
  <div class="map-view" id="mapView">
    <div class="map-top"><div class="title"><span>🗺️</span> <span>临空市</span></div><div class="header-btns"><button class="hbtn" onclick="showChat()">← 聊天</button></div></div>
    <div class="map-stage" id="mapStage">
      <div id="mapCanvas"><img id="mapImg" alt="map"></div>
      <div class="place-hint" id="placeHint" style="display:none">📌 点击地图放置 <span class="cancel" onclick="cancelPlace()">✕ 取消</span></div>
    </div>
    <div class="map-bar">
      <button class="bar-btn" onclick="showBuildSheet()">➕ 建造</button>
      <button class="bar-btn" id="editBtn" onclick="toggleEditMode()">✋ 整理</button>
      <button class="bar-btn" onclick="zoomMap(0.4)">＋</button>
      <button class="bar-btn" onclick="zoomMap(-0.4)">－</button>
    </div>
  </div>
  <div class="map-view" id="regionView">
    <div class="map-top"><div class="title"><span>📍</span> <span id="regionTitle">区域</span></div><div class="header-btns"><button class="hbtn" onclick="showMap()">← 总览</button></div></div>
    <div class="map-stage" id="regionStage">
      <div id="regionCanvas"><img id="regionImg" alt="region"></div>
      <div class="place-hint" id="regionPlaceHint" style="display:none">📌 点击放置 <span class="cancel" onclick="cancelPlace()">✕ 取消</span></div>
    </div>
    <div class="map-bar">
      <button class="bar-btn" onclick="showBuildSheet()">➕ 建造</button>
      <button class="bar-btn" id="regionEditBtn" onclick="toggleEditMode()">✋ 整理</button>
      <button class="bar-btn" onclick="zoomRegion(0.4)">＋</button>
      <button class="bar-btn" onclick="zoomRegion(-0.4)">－</button>
    </div>
  </div>
  <div class="building-view" id="buildingView">
    <div class="map-top"><div class="title"><span id="bEmoji">🏠</span> <span id="bTitle">建筑</span></div><div class="header-btns"><button class="hbtn" onclick="backFromBuilding()">← 返回</button></div></div>
    <div class="bv-body" id="bvBody"></div>
    <div class="bchat-wrap" id="bChatWrap" style="display:none">
      <div class="bchat-head"><b>💬 <span id="bChatTitle">对话</span></b><span style="font-size:11px;color:#7fd0ff;cursor:pointer" onclick="toggleBChat()">收起 ▲</span></div>
      <div class="bchat-list" id="bChatList"></div>
      <div class="bchat-bar"><input id="bChatInput" placeholder="在这个建筑里说话…"><button class="btn" style="margin:0" onclick="sendBMsg()">发送</button></div>
    </div>
  </div>
  <div class="sheet-mask" id="buildMask" onclick="hideBuildSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="s-title">🏗️ 建造</div>
      <div class="s-grid" id="buildGrid"></div>
      <button class="s-close" onclick="hideBuildSheet()">关闭</button>
    </div>
  </div>
  <div class="sheet-mask" id="styleMask" onclick="hideStyleSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="s-title">🎨 选择建筑样式</div>
      <div class="style-grid" id="styleGrid"></div>
      <button class="s-close" onclick="hideStyleSheet()">关闭</button>
    </div>
  </div>
  <div class="sheet-mask" id="opMask" onclick="hideOp()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="s-title" id="opTitle">操作</div>
      <div class="s-grid" id="opGrid"></div>
      <button class="s-close" onclick="hideOp()">关闭</button>
    </div>
  </div>
  <div class="modal-mask" id="settingsMask" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <h3>⚙️ 设置</h3>
      <div class="set-group" id="editLockGroup" style="display:none">
        <label>🔒 编辑权限</label>
        <div class="row"><input class="input" id="editPwdInput" type="password" placeholder="输入编辑密码" style="flex:1"><button class="btn green" onclick="unlockEdit()">解锁</button></div>
        <div class="tip" id="editLockTip"></div>
      </div>
      <div class="set-group" id="ecoGroup"><label>💰 钱包</label><div class="row"><button class="btn" onclick="refreshEco()">💰 刷新</button></div><div id="ecoInfo" class="tip" style="margin-top:6px"></div><div class="tip" style="margin-top:4px">上班/下班/设常驻 → 到对应公共建筑里操作</div></div>
      <div class="set-group" id="trailGroup"><label>👣 AI 行动轨迹 &amp; 📣 召唤</label><div class="row"><button class="btn" onclick="openTrail()">👣 查看轨迹</button><button class="btn gray" onclick="summonAI()">📣 召唤我的 AI</button></div><div id="trailList" class="tip" style="margin-top:6px"></div></div>
      <div class="editset" id="eset1"><div class="set-group"><label>👤 我的名字</label><div class="row"><input class="input" id="setName" style="flex:1"><button class="btn" onclick="saveName()">保存</button></div></div></div>

      <div class="editset" id="eset3"><div class="set-group"><label>💬 气泡配对配色</label><div class="row"><input class="input" id="pairNames" placeholder="真人名 + AI名（逗号分隔）如：亦言,黎深" style="flex:1"></div><div id="pairColors" style="margin-bottom:6px"></div><button class="btn" onclick="addPair()">➕ 添加配对</button><div id="pairList" style="margin-top:8px"></div></div></div>
      <div class="editset" id="eset4"><div class="set-group"><label>🖼️ 头像（给谁设？）</label><div class="row"><input class="input" id="avatarName" style="flex:1"><input type="file" id="avatarFile" accept="image/*" style="font-size:12px"></div><button class="btn" onclick="uploadAvatar()">上传头像</button></div></div>
      <div class="editset" id="eset5"><div class="set-group"><label>🔊 朗读（名字逗号分隔）</label><div class="row"><input class="input" id="setSpeak" style="flex:1"></div><label style="font-size:12px;color:#7fa8cf"><input type="checkbox" id="speakAll"> 朗读所有人新消息</label><button class="btn" onclick="saveSpeak()">保存</button></div></div>
      <div class="editset" id="eset6"><div class="set-group"><label>⏰ 时间（当前房间）</label><div class="row"><select class="input" id="setTimeMode" style="flex:1"><option value="real">现实时间（北京）</option><option value="fixed">剧情时间</option></select><input class="input" id="setFixedTime" placeholder="如 19:00" style="width:90px"></div><button class="btn" onclick="saveTimeSettings()">保存</button></div></div>
      <div class="editset" id="eset7"><div class="set-group"><label>📦 数据备份</label><div class="row"><button class="btn" onclick="backupNow()">📥 下载备份</button><button class="btn gray" onclick="restoreBackup()">📤 恢复备份</button></div></div></div>
      <div class="editset" id="eset8"><div class="set-group"><label>🗄️ 自动备份（防丢失）</label><div class="tip" style="margin-bottom:6px">服务器每30分钟自动快照 + 每次保存留上一版；你的手机每30分钟也存一份世界副本。</div><div class="row"><button class="btn" onclick="restoreWorldBackup()">📤 从手机备份恢复</button><button class="btn gray" onclick="loadServerBackups()">🗄️ 查看服务器快照</button></div><div id="srvBackupList" class="tip" style="margin-top:6px"></div></div></div>
      <button class="btn gray" style="width:100%;margin-top:6px" onclick="closeSettings()">关闭</button>
    </div>
  </div>
  <div class="modal-mask" id="smsMask" onclick="if(event.target===this)hideSms()">
    <div class="modal" style="max-height:80%">

        <button id="ptabNote" class="on" onclick="setPrivTab('note')">💌 纸条</button>
        <button id="ptabDiary" onclick="setPrivTab('diary')">📖 日记</button>

</div>
<script>
var userName = localStorage.getItem('gc_name') || '';
var currentRoom = localStorage.getItem('gc_room') || 'main';
var roomPassword = localStorage.getItem('gc_pwd_' + currentRoom) || '';
var avatars = {}, lastMsgKey = '', speakAll = localStorage.getItem('gc_speakAll') === '1';
var speakNames = (localStorage.getItem('gc_speak') || '').split(',').filter(Boolean);
var mapData = { regions: {}, buildings: {}, npcs: {}, room_bg: {}, rooms: {}, room_access: {}, room_requests: {}, user_ais: {}, work_sessions: {}, home_jobs: {} };
var currentRegion = null, currentBuilding = null, buildingFromRegion = false;
var editMode = false, placeType = null, pendingEmoji = '🏠', pendingType = null, myHomeBid = null;
var noteRoom = null, replyNoteId = null, opTarget = null, opType = null;
var privTab = 'note', privBuildingId = null;
var colorPairs = JSON.parse(localStorage.getItem('gc_pairs') || '[]');
var selectedPairColor = 0;
var editLocked = false;
var editUnlocked = localStorage.getItem('gc_edit') === '1';
var smsOut = JSON.parse(localStorage.getItem('gc_sms_out') || '[]');
var bChatOn = false;
var PAIR_COLORS = [
  {name:'深蓝/浅蓝', dark:'#0e6fd4', light:'#8fd0ff'},
  {name:'桃红/浅红', dark:'#e0487a', light:'#ffb3c8'},
  {name:'翠绿/浅绿', dark:'#0e9f6e', light:'#a8e6c8'},
  {name:'金黄/浅黄', dark:'#d9a013', light:'#ffe9a8'},
  {name:'紫罗兰/浅紫', dark:'#8e5bd0', light:'#d5b8ff'}
];
function api(url, options) { return fetch(url, options).then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.detail || ('HTTP '+r.status)); }); return r.json(); }); }
function esc(s) { var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function compressImage(dataUrl, maxW, quality, cb){
  var img = new Image();
  img.onload = function(){
    try{
      var w = img.width||600, h = img.height||400;
      if(w > maxW){ h = h * maxW / w; w = maxW; }
      var c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', quality));
    }catch(err){ cb(dataUrl); }
  };
  img.onerror = function(){ cb(dataUrl); };
  img.src = dataUrl;
}
function toast(msg){ var t=document.createElement('div'); t.style.cssText='position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,25,45,.95);color:#bfe6ff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;border:1px solid rgba(80,180,255,.4);transition:opacity .4s'; t.textContent=msg; document.querySelector('.app').appendChild(t); setTimeout(function(){t.style.opacity='0'; setTimeout(function(){t.remove();},400);},3500); }
function roomLabel(r){ return r==='main'?'公共大厅':r; }
if(!userName){ userName=prompt('欢迎来到人❤️机の小窝！请输入你的名字：','亦言')||'亦言'; localStorage.setItem('gc_name',userName); }
// ===== 短信 =====
function saveSmsOut(){ localStorage.setItem('gc_sms_out', JSON.stringify(smsOut)); }
function openSms(){ document.getElementById('smsMask').classList.add('show'); loadSms(); }
function hideSms(){ document.getElementById('smsMask').classList.remove('show'); }
function smsTo(name){ document.getElementById('smsTo').value = name; openSms(); }
function loadSms(){
  api('/api/sms?user='+encodeURIComponent(userName)).then(function(d){
    var got = d.sms||[]; var rows = [];
    got.forEach(function(m){ rows.push({mine:false, from:m.from, text:m.text, time:m.time}); });
    smsOut.forEach(function(m){ rows.push({mine:true, from:userName, text:m.text, time:m.time}); });
    rows.sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
    var el = document.getElementById('smsList');
    if(!rows.length){ el.innerHTML='<div style="text-align:center;color:#999;padding:20px">暂无短信</div>'; return; }
    el.innerHTML='';
    rows.forEach(function(m){
      var row=document.createElement('div'); row.className='sms-row '+(m.mine?'mine':'them');
      var b=document.createElement('div'); b.className='sms-bubble'; b.textContent=m.text;
      var t=document.createElement('span'); t.className='sms-time'; t.textContent=(m.time||'').slice(11,16);
      if(!m.mine){ b.title='回复 '+m.from; b.style.cursor='pointer'; b.onclick=function(){ document.getElementById('smsTo').value=m.from; }; }
      row.appendChild(b); row.appendChild(t); el.appendChild(row);
    });
    el.scrollTop=el.scrollHeight;
    document.getElementById('smsDot').style.display='none';
  }).catch(function(){});
}
function sendSms(){
  var to = document.getElementById('smsTo').value.trim(); var text = document.getElementById('smsText').value.trim();
  if(!to){ toast('填收件人名字'); return; }
  if(!text){ toast('写点内容'); return; }
  api('/api/sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:userName,to:to,text:text})}).then(function(){
    var now=new Date(); smsOut.push({to:to,text:text,time:now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)+' '+now.toTimeString().slice(0,8)});
    saveSmsOut(); document.getElementById('smsText').value=''; toast('📩 已发给 '+to); loadSms();
  }).catch(function(e){ toast('❌ '+e.message); });
}
function checkSms(){
  api('/api/sms?user='+encodeURIComponent(userName)).then(function(d){
    var n = (d.sms||[]).length; var shown = document.getElementById('smsList');
    if(n>0 && !(shown && shown.textContent)) document.getElementById('smsDot').style.display='';
  }).catch(function(){});
}
// ===== 建筑对话框 =====
function hallRoomOf(bid){ var b=mapData.buildings[bid]; return (b?b.name:'')+'·会客厅'; }
function toggleBChat(){ bChatOn=!bChatOn; document.getElementById('bChatWrap').style.display = bChatOn?'flex':'none'; if(bChatOn) loadBChat(); }
function loadBChat(){
  if(!currentBuilding || !bChatOn) return;
  var hall = hallRoomOf(currentBuilding);
  document.getElementById('bChatTitle').textContent = hall;
  api('/api/messages?room='+encodeURIComponent(hall)+'&user='+encodeURIComponent(userName)).then(function(d){
    var el=document.getElementById('bChatList'); el.innerHTML='';
    (d.messages||[]).forEach(function(m){ el.appendChild(renderBMsg(m)); });
    el.scrollTop=el.scrollHeight;
  }).catch(function(){});
}
function renderBMsg(m){
  var d=document.createElement('div'); var isMe=m.sender===userName; d.style.cssText='display:flex;align-items:flex-end;margin-bottom:8px;'+(isMe?'justify-content:flex-end;':'');
  if(m.sender==='system'){ var b0=document.createElement('div'); b0.style.cssText='background:transparent;color:#6d8bb0;font-size:12px;text-align:center;width:100%'; b0.textContent=m.content; d.appendChild(b0); return d; }
  var av=document.createElement('div'); var a=avatars[m.sender];
  av.style.cssText='width:26px;height:26px;border-radius:50%;background:#1d3150;display:flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden;flex-shrink:0;margin:0 5px;'+(isMe?'order:2;':'order:0;');
  av.innerHTML = a?'<img src="'+a+'" style="width:100%;height:100%;object-fit:cover">':esc((m.sender||'?').charAt(0));
  var b=document.createElement('div');
  b.style.cssText='max-width:68%;padding:7px 11px;border-radius:9px;font-size:14px;line-height:1.5;word-break:break-word;background:'+(isMe?'#95ec69':'#1c2f4d')+';color:'+(isMe?'#000':'#e6f1ff')+';'+(isMe?'':'border:1px solid rgba(255,255,255,.1);');
  b.textContent=m.content;
  d.appendChild(av); d.appendChild(b); return d;
}
function sendBMsg(){
  var inp=document.getElementById('bChatInput'); var content=inp.value.trim(); if(!content) return;
  var hall = hallRoomOf(currentBuilding);
  api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:userName,content:content,role:'user',room:hall})}).then(function(){ inp.value=''; loadBChat(); }).catch(function(e){ toast('❌ '+e.message); });
}
function openTrail(){
  var today = new Date(); var key = 'gc_trail_'+today.getFullYear()+today.getMonth()+today.getDate();
  if(localStorage.getItem(key)){ toast('👣 今天的轨迹已经看过了，明天再来吧～'); }
  localStorage.setItem(key, '1');
  api('/api/trails?user='+encodeURIComponent(userName)).then(function(d){
    var el = document.getElementById('trailList'); var items = d.trails||[];
    if(!items.length){ el.innerHTML='今天还没有行动轨迹（等你的 AI 出门逛逛吧～）'; return; }
    var days = {};
    items.slice().reverse().forEach(function(t){ var ds=(t.time||'').slice(0,10); if(!days[ds])days[ds]=[]; days[ds].push(t); });
    el.innerHTML='';
    Object.keys(days).forEach(function(ds){
      el.innerHTML += '<div style="margin-top:8px"><b style="color:#ffd166">📅 '+esc(ds)+'</b></div>';
      days[ds].forEach(function(t){
        var link = (t.room&&t.tab) ? ' <span style="color:#7fd0ff;cursor:pointer" onclick="goToTrailSpot(\''+esc(t.room)+'\',\''+esc(t.tab)+'\')">去看看 →</span>' : '';
        el.innerHTML += '<div style="padding:4px 0;font-size:12px;color:#cfe8ff">🕐 '+esc(t.time)+' · '+esc(t.text)+link+'</div>';
      });
    });
  }).catch(function(e){ toast('❌ '+e.message); });
}
function summonAI(){
  var ais = (mapData.user_ais[userName]||[]);
  if(!ais.length){ toast('请先在设置里登记「我的 AI」名字'); return; }
  var ai = ais.length===1 ? ais[0] : ais[parseInt(prompt('召唤哪个 AI？\n'+ais.map(function(a,i){return (i+1)+'. '+a;}).join('\n'),'1')||'1',10)-1];
  if(!ai) return;
  api('/api/summon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ai:ai,room:currentRoom})}).then(function(d){ toast('📣 '+d.msg); loadMessages(true); }).catch(function(e){ toast('❌ '+e.message); });
}
function goToTrailSpot(room, tab){
  currentRoom=room; roomPassword=localStorage.getItem('gc_pwd_'+room)||''; localStorage.setItem('gc_room',room);
  document.getElementById('roomName').textContent=roomLabel(room);
  applyBg(room); reportRoom();
  showChat();
  setTimeout(function(){ privTab=tab; togglePrivate(); }, 400);
}
// ===== 经济系统 =====
function refreshEco(){
  api('/api/economy?user='+encodeURIComponent(userName)).then(function(d){
    var info = document.getElementById('ecoInfo');
    var txt = '💰 我的余额：' + (d.wallet||0).toFixed(0) + ' 金币';
    var w = d.working;
    if(w){ var b = mapData.buildings[w.building_id]; var left = Math.max(0, Math.ceil(w.start_ts + w.hours*3600 - Date.now()/1000)); txt += '<br>💼 上班中：' + (b?b.name:'?') + '（剩 ' + Math.floor(left/60) + ' 分钟）'; }
    var hj = d.home_jobs[userName]; if(hj) txt += '<br>🏢 我的常驻：' + esc(hj);
    (mapData.user_ais[userName]||[]).forEach(function(ai){ if(d.home_jobs[ai]) txt += '<br>🤖 '+esc(ai)+' 常驻：'+esc(d.home_jobs[ai]); });
    info.innerHTML = txt;
  }).catch(function(e){ toast('❌ '+e.message); });
}
function workBids(){
  return Object.keys(mapData.buildings).filter(function(bid){ var b=mapData.buildings[bid]; return b.type==='npc' && (b.features||[]).indexOf('work')>=0 && b.salary>0; });
}
function goWorkHere(){
  var b = mapData.buildings[currentBuilding];
  if(!b || b.type!=='npc' || (b.features||[]).indexOf('work')<0 || !b.salary){ toast('这个建筑没有工作功能'); return; }
  var h = parseInt(prompt('在这里上班多久？（1/2/4 小时）','2')||'2',10);
  api('/api/work/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:userName,building_id:currentBuilding,hours:h})}).then(function(d){ toast('✅ '+d.msg); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function stopWorkHere(){
  api('/api/work/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:userName})}).then(function(d){ toast('✅ '+d.msg); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function setAiWork(){
  var b = mapData.buildings[currentBuilding];
  if(!b || b.type!=='npc' || (b.features||[]).indexOf('work')<0 || !b.salary){ toast('这个建筑没有工作功能'); return; }
  var ais = [];
  Object.keys(mapData.user_ais||{}).forEach(function(u){ (mapData.user_ais[u]||[]).forEach(function(a){ if(ais.indexOf(a)<0) ais.push(a); }); });
  if(!ais.length){ toast('还没有登记 AI'); return; }
  var pick = prompt('安排谁在这里上班？\n'+ais.map(function(n,i){return (i+1)+'. '+n;}).join('\n'),'1');
  var ai = ais[parseInt(pick||'1',10)-1]; if(!ai) return;
  var h = parseInt(prompt('上多久？（1/2/4 小时）','2')||'2',10);
  api('/api/work/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ai,building_id:currentBuilding,hours:h})}).then(function(d){ toast('✅ '+ai+' 已上班'); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function setHomeJobHere(){
  var b = mapData.buildings[currentBuilding]; if(!b) return;
  // 列所有真人 + 所有AI
  var targets = [];
  Object.keys(mapData.user_ais||{}).forEach(function(u){ targets.push(u); (mapData.user_ais[u]||[]).forEach(function(a){ targets.push(a); }); });
  if(!targets.length){ toast('还没有成员'); return; }
  targets = targets.filter(function(v,i){ return targets.indexOf(v)===i; });
  var tp = prompt('设置「'+b.name+'」为谁的常驻工作？\n'+targets.map(function(n,i){return (i+1)+'. '+n;}).join('\n'),'1');
  var tname = targets[parseInt(tp||'1',10)-1]; if(!tname) return;
  var isAi = Object.keys(mapData.user_ais||{}).some(function(u){ return (mapData.user_ais[u]||[]).indexOf(tname)>=0; });
  api('/api/home_jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:isAi?'':tname,ai:isAi?tname:'',building_id:currentBuilding})}).then(function(d){ toast('✅ '+tname+' 常驻于 '+b.name); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function setBuildingFeatures(){
  var b = mapData.buildings[currentBuilding];
  if(!b || b.type!=='npc'){ toast('只有公共建筑可以设置功能'); return; }
  var cur = b.features||[];
  var f = prompt('功能（逗号分隔，可填 work/shop/fun/date 或中文 工作/购物/娱乐/约会）：', cur.join(',')||'work');
  var feats = (f||'').split(/[,，]/).map(function(s){ return s.trim(); }).map(function(s){ return ({'工作':'work','购物':'shop','娱乐':'fun','约会':'date'}[s]||s); }).filter(function(s){ return ['work','shop','fun','date'].indexOf(s)>=0; });
  var sal = parseFloat(prompt('时薪（金币/小时，0=不可工作）：', b.salary||50)||'0');
  api('/api/building/features',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({building_id:currentBuilding,features:feats,salary:sal})}).then(function(d){ toast('✅ '+d.msg); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function setBuildingNotice(){
  var b = mapData.buildings[currentBuilding];
  if(!b) return;
  var n = prompt('📢 写公告（来这个建筑的人都能看到）：', b.notice||'');
  if(n===null) return;
  api('/api/building/notice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({building_id:currentBuilding,notice:n})}).then(function(d){ toast('✅ '+d.msg); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function worldSnapshot(){
  api('/api/backup').then(function(d){
    var slim = {regions:d.regions, buildings:d.buildings, npcs:d.npcs, notes:d.notes, diaries:d.diaries, stories:d.stories, room_bg:d.room_bg, room_access:d.room_access, room_requests:d.room_requests, user_ais:d.user_ais, time_settings:d.time_settings, building_seq:d.building_seq, note_seq:d.note_seq, edit_pwd:d.edit_pwd, wallets:d.wallets, home_jobs:d.home_jobs, work_sessions:d.work_sessions, ts:new Date().toLocaleString()};
    try{ localStorage.setItem('gc_world_backup', JSON.stringify(slim)); }catch(e){}
  }).catch(function(){});
}
function restoreWorldBackup(){
  var raw = localStorage.getItem('gc_world_backup');

var gestures = {};
function initGestures(scope){
  var stage = stageOf(scope); var canvas = canvasOf(scope);
  var g = { pointers:{}, pinch:false, dist:0, moved:false, downX:0, downY:0 };
  gestures[scope]=g;
  stage.addEventListener('pointerdown', function(e){
    if(placeType){ onStageTap(e, scope); return; }
    g.pointers[e.pointerId]={x:e.clientX,y:e.clientY}; g.moved=false; g.downX=e.clientX; g.downY=e.clientY;
    if(Object.keys(g.pointers).length===2){ g.pinch=true; g.dist=dist(g); }
    stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e){
    if(placeType) return;
    if(!(e.pointerId in g.pointers)) return;
    var prev=g.pointers[e.pointerId]; var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    g.pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Math.abs(e.clientX-g.downX)+Math.abs(e.clientY-g.downY)>8) g.moved=true;
    if(g.pinch){
      var keys=Object.keys(g.pointers);
      if(keys.length===2){
        var p1=g.pointers[keys[0]], p2=g.pointers[keys[1]];
        var nd=Math.hypot(p1.x-p2.x,p1.y-p2.y);
        if(g.dist>0){ var s=parseFloat(canvas.dataset.s||'1'); var ns=Math.max(0.5,Math.min(4,s*nd/g.dist)); canvas.dataset.s=ns; applyTransform(canvas,scope); }
        g.dist=nd;
      }
    } else {
      var x=parseFloat(canvas.dataset.x||'0'), y=parseFloat(canvas.dataset.y||'0');
      canvas.dataset.x=x+dx; canvas.dataset.y=y+dy; applyTransform(canvas,scope);
    }
  });
  stage.addEventListener('pointerup', function(e){ delete g.pointers[e.pointerId]; if(g.pinch && Object.keys(g.pointers).length<2){ g.pinch=false; } });
  stage.addEventListener('pointercancel', function(e){ delete g.pointers[e.pointerId]; if(g.pinch&&Object.keys(g.pointers).length<2) g.pinch=false; });
  stage.addEventListener('dblclick', function(){ zoomAt(scope, 0.5); });
}
function dist(g){ var k=Object.keys(g.pointers); if(k.length<2) return 0; var p1=g.pointers[k[0]],p2=g.pointers[k[1]]; return Math.hypot(p1.x-p2.x,p1.y-p2.y); }
function applyTransform(canvas, scope){
  var s=parseFloat(canvas.dataset.s||'1'), x=parseFloat(canvas.dataset.x||'0'), y=parseFloat(canvas.dataset.y||'0');
  var stage=stageOf(scope), cw=parseFloat(canvas.dataset.w||stage.clientWidth), ch=parseFloat(canvas.dataset.h||stage.clientHeight);
  var sw=stage.clientWidth, sh=stage.clientHeight;
  var maxX=Math.max(0, cw*s - sw); var maxY=Math.max(0, ch*s - sh);
  x=Math.max(-maxX, Math.min(0, x)); y=Math.max(-maxY, Math.min(0, y));
  canvas.dataset.x=x; canvas.dataset.y=y;
  canvas.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';
}

function zoomAt(scope,d){ var c=canvasOf(scope); c.dataset.s=Math.max(0.5,Math.min(4,(parseFloat(c.dataset.s||'1')+d))); applyTransform(c,scope); }
initGestures('map'); initGestures('region');
function openRegion(name){ var r=mapData.regions[name]; if(r&&r.image){ showRegion(name); } else { toast('📍 「'+name+'」暂无分区图'); } }
function renderBuilding(){
  var b=mapData.buildings[currentBuilding]; if(!b) return;
  document.getElementById('bEmoji').textContent=b.emoji;
  document.getElementById('bTitle').textContent=b.name;
  var isOwner = b.owner === userName;
  var isPublic = b.type==='npc';
  var ce = canEdit();
  var el=document.getElementById('bvBody'); var html='';
  html+='<div class="section-title">📝 简介</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="tip" style="flex:1">'+esc(b.description||'（暂无简介，AI 逛之前会读）')+'</span>'+(ce&&(isOwner||isPublic)?'<span style="cursor:pointer;font-size:16px" onclick="editBuildingDesc()">✏️</span>':'')+'</div>';
  if(isPublic){
    html+='<div style="background:#14283f;border:1px solid rgba(255,200,80,.4);border-radius:10px;padding:10px;margin:8px 0"><div style="display:flex;align-items:center;gap:8px"><b style="color:#ffd166">📢 公告栏</b>'+(ce?'<span style="cursor:pointer;font-size:14px;color:#7fd0ff;margin-left:auto" onclick="setBuildingNotice()">✏️</span>':'')+'</div><div class="tip" style="margin-top:4px;white-space:pre-wrap">'+esc(b.notice||'（暂无公告）')+'</div></div>';
  }
  html+='<div class="section-title">'+(isPublic?'🏛️ 创建者：'+esc(b.owner||'?') : '👑 主人：'+esc(b.owner||'?'))+'</div>';
  if(isPublic){
    var feats=(b.features||[]).map(function(f){ return {work:'💼工作',shop:'🛍️购物',fun:'🎮娱乐',date:'💕约会'}[f]||f; }).join(' ');
    html+='<div style="display:flex;align-items:center;gap:10px;margin:10px 0"><button class="btn" onclick="setBuildingFeatures()">⚙️ 功能设置</button><span class="tip" style="flex:1">'+(feats||'暂无功能')+' · 时薪：'+((b.salary||0).toFixed(0))+'</span></div>';
    html+='<div class="home-actions" style="margin:8px 0"><button class="act-btn" onclick="setAiWork()">🤖 安排AI上班</button><button class="act-btn" onclick="setHomeJobHere()">🏠 常驻</button><button class="act-btn" onclick="goWorkHere()">💼 上班</button><button class="act-btn" onclick="stopWorkHere()">🏃 下班</button><button class="act-btn" onclick="toggleBChat()">💬 对话</button></div>';
    var hjHere = Object.keys(mapData.home_jobs||{}).filter(function(n){ return mapData.home_jobs[n]===b.name; });
    if(hjHere.length) html+='<div style="margin:4px 0"><span class="tip">🏠 常驻于此：'+hjHere.map(esc).join('、')+'</span></div>';
  }
  var wsNames = Object.keys(mapData.work_sessions||{}).filter(function(n){ return mapData.work_sessions[n].building_id===currentBuilding; });
  if(wsNames.length){
    html+='<div style="margin:8px 0"><div class="tip" style="margin-bottom:6px">👔 正在此工作（点击发短信）：</div><div style="display:flex;gap:10px;flex-wrap:wrap">';
    wsNames.forEach(function(n){
      var av=avatars[n]; var ch=(n||'?').charAt(0);
      html+='<div style="cursor:pointer;text-align:center" onclick="smsTo(\''+esc(n)+'\')" title="给'+esc(n)+'发短信">'+(av?'<img src="'+av+'" style="width:34px;height:34px;border-radius:50%">':'<div style="width:34px;height:34px;border-radius:50%;background:#0e9f6e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;margin:0 auto">'+esc(ch)+'</div>')+'<div style="font-size:10px;color:#9fd8ff">'+esc(n)+'</div></div>';
    });
    html+='</div></div>';
  }
  if(b.type==='home'){
    html+='<div class="section-title">🚪 房间</div><div class="room-grid">';
    (b.rooms||[]).forEach(function(r){
      var hall = r.indexOf('·会客厅')>=0;
      var lockTxt = hall ? '<span class="r-hall">🛋️ 公共会客区</span>' : '<span class="r-lock">🔒 私密·需申请</span>';
      html+='<div class="room-cell '+(hall?'hall':'locked')+'" onclick="enterRoom(\''+esc(r)+'\')"><span class="r-emoji">'+(hall?'🛋️':'🚪')+'</span><span class="r-name">'+esc(r)+'</span>'+lockTxt+'</div>';
    });
    if(ce) html+='<div class="room-cell add" onclick="createBuildingRoom()">+</div>';
    html+='</div>';
  }
  if(ce && isOwner && !isPublic){
    var reqCount = 0, reqList = [];
    (b.rooms||[]).forEach(function(r){
      (mapData.room_requests[r]||[]).forEach(function(q){ reqCount++; reqList.push({room:r, q:q}); });

      });
    }
  }
  html+='<div class="section-title">👥 NPC（'+((mapData.npcs[currentBuilding]||[]).length)+' 人）'+(ce?'<span style="cursor:pointer;font-size:16px;margin-left:8px" onclick="addNpcPrompt()">➕</span>':'')+'</div>';
  (mapData.npcs[currentBuilding]||[]).forEach(function(n){ html+='<div class="npc-card"><span class="n-emoji">'+esc(n.emoji)+'</span><div><div class="n-name">'+esc(n.name)+'</div><div class="n-desc">'+esc(n.desc||'')+'</div></div>'+(ce?'<span style="cursor:pointer;color:#7fd0ff;font-size:14px;margin-left:auto" onclick="editNpc(\''+esc(n.name)+'\')">✏️</span><span style="cursor:pointer;color:#ff6b6b;font-size:14px;margin-left:8px" onclick="deleteNpc(\''+esc(n.name)+'\')">🗑️</span>':'')+'</div>'; });
  html+='<div style="margin:10px 0"><button class="btn" style="width:100%" onclick="loadStoryModal()">🎬 剧情簿（'+((mapData.stories?0:0))+ '条）</button></div>';
  el.innerHTML=html;
}
function loadStoryModal(){
  var b=mapData.buildings[currentBuilding]; if(!b) return;
  document.getElementById('storyTitle').textContent=b.name;
  api('/api/story?building_id='+encodeURIComponent(currentBuilding)).then(function(d){
    var sts=d.stories||[]; var el=document.getElementById('storyList'); el.innerHTML='';

    else { sts.slice().reverse().forEach(function(s){ el.innerHTML+='<div class="story-card"><div class="s-time">'+esc(s.time)+'</div><div class="s-author">'+esc(s.author)+'</div><div class="s-text">'+esc(s.text)+'</div></div>'; }); }
    document.getElementById('storyMask').classList.add('show');
  }).catch(function(e){ toast('❌ '+e.message); });
}
function hideStoryModal(){ document.getElementById('storyMask').classList.remove('show'); }
function grantUserDirect(room,user,allow){

}
function editBuildingDesc(){
  var b=mapData.buildings[currentBuilding];
  var d=prompt('建筑简介（这个建筑是做什么的？AI 逛之前会读）：',b.description||'');

  api('/api/map/building/desc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({building_id:currentBuilding,description:d})}).then(function(){ toast('✅ 简介已更新'); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function editNpc(name){
  var list=mapData.npcs[currentBuilding]||[];
  var n=null; for(var i=0;i<list.length;i++){ if(list[i].name===name){ n=list[i]; break; } }
  if(!n) return;
  var nn=prompt('NPC 名字：',n.name); if(!nn) return;
  var em=prompt('头像 emoji：',n.emoji||'👤')||'👤';
  var dd=prompt('人设：',n.desc||'')||'';
  api('/api/npc/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({building_id:currentBuilding,name:name,new_name:nn,emoji:em,desc:dd})}).then(function(){ toast('✅ NPC 已更新'); loadMapData().then(renderBuilding); }).catch(function(e){ toast('❌ '+e.message); });
}
function createBuildingRoom(){
  var name=prompt('房间名字（如：卧室、书房）：',''); if(!name) return;
  var desc=prompt('房间简介（AI 进房间会读，知道这房间是干嘛的）：','')||'';
  api('/api/map/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({building_id:currentBuilding,name:name})}).then(function(d){
    if(desc) api('/api/room/desc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:d.room,description:desc})}).then(function(){});
    toast('✅ 房间「'+d.room+'」建成！'); loadMapData().then(function(){ renderBuilding(); loadRooms(); });
  }).catch(function(e){ toast('❌ '+e.message); });

function loadMapData(){ return api('/api/map').then(function(d){ mapData=d; }).catch(function(){}); }
function updateRoomUI(){
  var b=buildingOfRoom(currentRoom);
  var isHomeRoom = b!==null;
  var bar=document.getElementById('roomDescBar');
  var privBtn=document.getElementById('privBtn');
  var privFooterBtn=document.getElementById('privFooterBtn');
  if(isHomeRoom){
    bar.style.display='flex';
    var desc = currentRoom==='main' ? '' : (mapData.rooms&&mapData.rooms[currentRoom]&&mapData.rooms[currentRoom].description||'');
    document.getElementById('roomDescText').textContent = desc || '（暂无房间简介）';
    document.getElementById('roomDescEdit').style.display = (canEdit()&&(b.owner===userName||b.type==='npc')) ? '' : 'none';
    privBtn.style.display='';
    privFooterBtn.style.display='';
    privBuildingId = null;
    for(var bid in mapData.buildings){ if(mapData.buildings[bid]===b){ privBuildingId=bid; break; } }
  } else {
    bar.style.display='none';
    privBtn.style.display='none';
    privFooterBtn.style.display='none';
    privBuildingId=null;
  }
  document.getElementById('roomEmoji').textContent = currentRoom==='main' ? '🏠' : '🚪';
}
function editRoomDesc(){
  var d=prompt('房间简介：',(mapData.rooms&&mapData.rooms[currentRoom]&&mapData.rooms[currentRoom].description)||'');
  if(d===null) return;
  api('/api/room/desc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:currentRoom,description:d})}).then(function(){ toast('✅ 简介已更新'); loadMapData().then(updateRoomUI); }).catch(function(e){ toast('❌ '+e.message); });
}
function togglePrivate(){

  document.getElementById('privRoomName').textContent=roomLabel(currentRoom);
  var bg=mapData.room_bg[currentRoom];

  else { pm.style.backgroundImage='none'; pm.style.backgroundColor='#101d33'; }
  document.getElementById('privWrite').style.display = canEdit() ? '' : 'none';
  document.getElementById('privateMask').classList.add('show');

function hidePrivate(){ document.getElementById('privateMask').classList.remove('show'); }
function setPrivTab(t){
  privTab=t;
  document.getElementById('ptabNote').className = t==='note'?'on':'';
  document.getElementById('ptabDiary').className = t==='diary'?'on':'';
  document.getElementById('ptabStory').className = t==='story'?'on':'';
  document.getElementById('privInput').placeholder = t==='note'?'写一张纸条…':(t==='diary'?'写一篇日记…':(t==='story'?'写一段剧情…':'写点什么…'));
  loadPriv();
}
function loadPriv(){
  var el=document.getElementById('privList'); el.innerHTML='<div class="tip">加载中…</div>';
  if(privTab==='note'){
    api('/api/notes?room='+encodeURIComponent(currentRoom)).then(function(d){
      var items=d.notes||[]; el.innerHTML='';
      if(!items.length){ el.innerHTML='<div class="tip">💌 便签墙空空，等 AI 来留言吧</div>'; return; }
      items.slice().reverse().forEach(function(n){ el.innerHTML+='<div class="note-card"><div class="n-author">✍️ '+esc(n.author)+'</div><div class="n-text">'+esc(n.text)+'</div><div class="n-time">'+esc(n.time)+'</div>'+(n.reply?'<div class="n-reply">💬 '+esc(n.reply.author)+'：'+esc(n.reply.text)+'</div>':'')+'</div>'; });
    }).catch(function(e){ el.innerHTML='<div class="tip">'+esc(e.message)+'</div>'; });
  } else if(privTab==='diary'){
    api('/api/diaries?room='+encodeURIComponent(currentRoom)).then(function(d){
      var items=d.diaries||[]; el.innerHTML='';
      if(!items.length){ el.innerHTML='<div class="tip">📖 日记本空白，等 AI 来写心事吧</div>'; return; }
      items.slice().reverse().forEach(function(n,i){ var idx=items.length-1-i; el.innerHTML+='<div class="note-card"><div class="n-author">📖 '+esc(n.author)+'</div><div class="n-text">'+esc(n.text)+'</div><div class="n-time">'+esc(n.time)+'</div>'+(n.comment?'<div class="n-reply">✍️ '+esc(n.comment.author)+'批注：'+esc(n.comment.text)+'</div>':(canEdit()?'<span class="n-rep-btn" onclick="commentDiary('+idx+')">✍️ 批注</span>':''))+'</div>'; });
    }).catch(function(e){ el.innerHTML='<div class="tip">'+esc(e.message)+'</div>'; });
  } else {
    api('/api/story?building_id='+encodeURIComponent(privBuildingId)).then(function(d){
      var items=d.stories||[]; el.innerHTML='';
      if(!items.length){ el.innerHTML='<div class="tip">🎬 剧情簿空空，等 AI 来逛触发剧情吧</div>'; return; }
      items.slice().reverse().forEach(function(s){ el.innerHTML+='<div class="story-card"><div class="s-time">'+esc(s.time)+'</div><div class="s-author">'+esc(s.author)+'</div><div class="s-text">'+esc(s.text)+'</div></div>'; });
    }).catch(function(e){ el.innerHTML='<div class="tip">'+esc(e.message)+'</div>'; });
  }
}
function commentDiary(idx){
  var t=prompt('批注这篇日记：',''); if(!t) return;
  api('/api/diaries/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:currentRoom,index:idx,author:userName,text:t})}).then(function(){ toast('✍️ 批注成功'); loadPriv(); }).catch(function(e){ toast('❌ '+e.message); });
}
function submitPriv(){
  var text=document.getElementById('privInput').value.trim(); if(!text){ toast('写点什么吧'); return; }
  if(privTab==='note'){ api('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:currentRoom,author:userName,text:text})}).then(function(){ toast('💌 纸条已贴'); document.getElementById('privInput').value=''; loadPriv(); }).catch(function(e){ toast('❌ '+e.message); }); }
  else if(privTab==='diary'){ api('/api/diaries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:currentRoom,author:userName,text:text})}).then(function(){ toast('📖 日记已写'); document.getElementById('privInput').value=''; loadPriv(); }).catch(function(e){ toast('❌ '+e.message); }); }
  else { api('/api/story',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({building_id:privBuildingId,author:userName,text:text})}).then(function(){ toast('🎬 剧情已写'); document.getElementById('privInput').value=''; loadPriv(); }).catch(function(e){ toast('❌ '+e.message); }); }
}
function openPerm(){
  var b=mapData.buildings[currentBuilding];
  document.getElementById('permTitle').textContent='🔑 访问管理 · '+b.name;
  var el=document.getElementById('permList'); var rooms=b.rooms||[]; var html='';
  rooms.forEach(function(r){
    if(r.indexOf('·会客厅')>=0) return;
    var reqs = mapData.room_requests[r]||[]; var acc = mapData.room_access[r]||[];
    html+='<div class="set-group"><label>🔒 '+esc(r)+'</label>';
    if(reqs.length){
      html+='<div class="tip" style="margin-bottom:4px">📨 访问申请：</div>';
      reqs.forEach(function(q){ html+='<div class="req-card"><span class="q-name">👤 '+esc(q.applicant)+'</span><span class="q-time">'+esc(q.time)+'</span><button class="btn green" style="margin:0" onclick="grantUser(\''+esc(r)+'\',\''+esc(q.applicant)+'\',true)">同意</button><button class="btn gray" style="margin:0" onclick="grantUser(\''+esc(r)+'\',\''+esc(q.applicant)+'\',false)">拒绝</button></div>'; });
    } else { html+='<div class="tip">暂无访问申请</div>'; }
    if(acc.length){
      html+='<div class="tip" style="margin-top:6px">✅ 已授权：</div>';
      acc.forEach(function(u){ html+='<div class="req-card"><span class="q-name">👤 '+esc(u)+'</span><button class="btn red" style="margin:0" onclick="revokeUser(\''+esc(r)+'\',\''+esc(u)+'\')">移除</button></div>'; });
    }
    html+='</div>';
  });
  if(!rooms.length) html='<div class="tip">这个建筑还没有私密房间</div>';
  el.innerHTML=html; document.getElementById('permMask').classList.add('show');
}
function hidePerm(){ document.getElementById('permMask').classList.remove('show'); }

function setRoomBgHere(){
  if(!canEdit()){ toast('🔒 访客只读模式，无法设置背景'); return; }
  if(confirm('📷 直接选择本地图片做背景？\n（取消则输入图片网址）')){
    var f=document.createElement('input'); f.type='file'; f.accept='image/*';
    f.onchange=function(){ var file=f.files[0]; if(!file)return; var reader=new FileReader(); reader.onload=function(e){ compressImage(e.target.result, 1200, 0.8, function(small){ saveBg(currentRoom, small); }); }; reader.readAsDataURL(file); };
    f.click();
  } else {
    var url=prompt('背景图片网址：',''); if(url&&url.trim()) saveBg(currentRoom,url.trim());
  }
}
function saveBg(room,image){ api('/api/room/bg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:room,image:image})}).then(function(){ toast('🖼️ 背景已设置！'); loadMapData(); if(currentRoom===room) applyBg(room); }).catch(function(e){ toast('❌ '+e.message); }); }
function sendMessage(){
  var input=document.getElementById('msgInput'); var content=input.value.trim(); if(!content) return;
  input.value='';
  api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:userName,content:content,role:'user',room:currentRoom,password:roomPassword})}).then(function(d){ cachePush({sender:userName,content:content,role:'user',time:d.time||'',room:currentRoom}); loadMessages(true); }).catch(function(e){ toast('❌ 无法发送：'+e.message); });
}
document.getElementById('msgInput').addEventListener('keydown',function(e){ if(e.key==='Enter') sendMessage(); });
function cacheKey(){ return 'gc_msgs_'+currentRoom; }
function cachePush(m){ var a=JSON.parse(localStorage.getItem(cacheKey())||'[]'); a.push(m); if(a.length>400)a=a.slice(-400); localStorage.setItem(cacheKey(),JSON.stringify(a)); }
function restoreCache(){ var a=JSON.parse(localStorage.getItem(cacheKey())||'[]'); if(!a.length) return Promise.resolve(); return api('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:a,room:currentRoom,password:roomPassword})}).catch(function(){}); }
function loadMessages(silent){
  api('/api/messages?room='+encodeURIComponent(currentRoom)+'&password='+encodeURIComponent(roomPassword)+'&user='+encodeURIComponent(userName)).then(function(d){
    renderMessages(d.messages||[]); if(!silent&&(d.messages||[]).length) localStorage.setItem(cacheKey(),JSON.stringify(d.messages)); speakNewMessages(d.messages||[]);
  }).catch(function(e){ if(!silent) toast('⚠️ '+e.message); });
}
function renderMessages(msgs){
  var area=document.getElementById('msgArea');
  var stickToBottom = area.scrollTop + area.clientHeight >= area.scrollHeight - 50;
  area.innerHTML='';
  if(!msgs.length){ area.innerHTML='<div class="sys-tip">✨ 欢迎来到 '+esc(roomLabel(currentRoom))+'，说点什么吧~</div>'; return; }
  msgs.forEach(function(m){ if(m.sender==='system') area.appendChild(renderSystem(m.content)); else area.appendChild(renderMsg(m)); });
  if(stickToBottom) area.scrollTop=area.scrollHeight;
}
function renderSystem(t){ var d=document.createElement('div'); d.className='msg system'; d.innerHTML='<div class="bubble">'+esc(t)+'</div>'; return d; }
function renderMsg(m){
  var d=document.createElement('div'); var isMe=m.sender===userName; d.className='msg '+(isMe?'me':'other');
  var av=avatars[m.sender]; var avHtml=av?'<img src="'+av+'">':esc((m.sender||'?').charAt(0));
  var p=pairOf(m.sender);
  var isOwner = p && m.sender===p.owner;
  var bg = p ? (isOwner ? p.dark : p.light) : (isMe ? '#0e7fd4' : '#1c2f4d');
  var nameColor = p ? (isOwner ? p.dark : p.light) : '#7fd0ff';
  var textColor = p ? (isOwner ? '#ffffff' : '#16263c') : (isMe ? '#ffffff' : '#e6f1ff');
  var border = (!p && !isMe) ? 'border:1px solid rgba(255,255,255,.1);' : '';
  var nameTag=isMe?'':'<span style="color:'+nameColor+';font-weight:bold">'+esc(m.sender)+'</span> ';
  d.innerHTML='<div class="avatar">'+avHtml+'</div><div class="body"><div class="meta">'+nameTag+'<span>'+esc(m.time||'')+'</span></div><div class="bubble" style="background:'+bg+';color:'+textColor+';'+border+'">'+esc(m.content)+'</div></div>';
  return d;
}
function speakNewMessages(msgs){ if(!('speechSynthesis' in window)||(!speakAll&&!speakNames.length)||!msgs.length) return; var last=msgs[msgs.length-1]; var key=last.sender+'|'+last.content; if(key===lastMsgKey) return; lastMsgKey=key; var ok=(speakAll&&last.sender!==userName)||(!speakAll&&speakNames.indexOf(last.sender)>=0); if(!ok) return; try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance((last.sender==='system'?'':last.sender+'说：')+last.content); u.lang='zh-CN'; speechSynthesis.speak(u);}catch(e){} }
function refreshOnline(){ api('/api/online').then(function(d){ var count=0; (d.online||[]).forEach(function(u){ if(u.room===currentRoom){count++;} }); document.getElementById('onlineBadge').textContent=count+' 在线'; }).catch(function(){}); }
function showOnline(){ api('/api/online').then(function(d){ var names=(d.online||[]).filter(function(u){return u.room===currentRoom;}).map(function(u){return u.name;}); toast(names.length?'👥 在线：'+names.join('、'):'当前房间暂无在线成员'); }).catch(function(){}); }
function heartbeat(){ api('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:userName,room:currentRoom})}).catch(function(){}); refreshOnline(); }
function reportRoom(){ api('/api/current_room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:currentRoom,password:roomPassword})}).catch(function(){}); }
function switchRoom(room,pwd){
  currentRoom=room; roomPassword=pwd||''; localStorage.setItem('gc_room',room); localStorage.setItem('gc_pwd_'+room,roomPassword); lastMsgKey='';
  document.getElementById('roomName').textContent=roomLabel(room);
  var tabs=document.querySelectorAll('.room-tab'); tabs.forEach(function(t){t.classList.remove('active');}); var cur=document.getElementById('tab_'+room); if(cur)cur.classList.add('active');
  applyBg(room); reportRoom(); updateRoomUI(); restoreCache().then(function(){ loadMessages(false); }); refreshOnline();
}
function enterRoom(room){
  if(room===currentRoom){ showChat(); return; }
  if(isPrivateRoom(room) && !canEnterRoom(room)){
    if(confirm('🔒 房间「'+room+'」是私密的，需要主人同意才能进入。\n\n要申请访问吗？')){ applyRoom(room); }
    return;
  }
  api('/api/rooms').then(function(d){ var target=null; (d.rooms||[]).forEach(function(r){if(r.name===room)target=r;});
    if(target&&target.has_password){ var pwd=prompt('房间「'+roomLabel(room)+'」需要密码：',''); if(pwd===null)return; api('/api/rooms/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:room,password:pwd})}).then(function(){ switchRoom(room,pwd); showChat(); }).catch(function(e){ toast('❌ '+e.message); }); }
    else { switchRoom(room,''); showChat(); }
  }).catch(function(){ switchRoom(room,''); showChat(); });
}
function loadRooms(){
  api('/api/rooms').then(function(d){
    var tabs=document.getElementById('roomTabs'); tabs.innerHTML='';
    (d.rooms||[]).forEach(function(r){
      if(r.creator==='home'||r.creator==='hall') return;
      var b=document.createElement('button'); b.className='room-tab'+(r.name===currentRoom?' active':''); b.id='tab_'+r.name; b.innerHTML=(r.has_password?'🔒':'')+esc(roomLabel(r.name)); b.onclick=function(){ enterRoom(r.name); }; tabs.appendChild(b);
    });
  }).catch(function(){});
}
function openSettings(){
  document.getElementById('setName').value=userName;
  document.getElementById('setMyAis').value=(mapData.user_ais[userName]||[]).join(',');
  document.getElementById('setSpeak').value=speakNames.join(','); document.getElementById('speakAll').checked=speakAll;
  renderPairColors(); renderPairList(); loadTimeSettings();
  refreshEco();
  var lockGroup=document.getElementById('editLockGroup');
  var lockLabel = lockGroup.querySelector('label');
  var lockBtn = lockGroup.querySelector('button');
  var lockInput = document.getElementById('editPwdInput');
  var lockTip = document.getElementById('editLockTip');
  if(!editLocked){
    lockGroup.style.display = '';
    lockLabel.textContent = '🔒 设置编辑密码（设置后游客只能看，不能改）';
    lockBtn.textContent = '设置';
    lockInput.placeholder = '设置一个编辑密码';
    lockTip.textContent = '注意：设置后你自己也要输密码才能编辑，请记好！';
  } else if(editUnlocked){
    lockGroup.style.display = '';
    lockLabel.textContent = '🔒 编辑权限：已解锁 ✅';
    lockBtn.textContent = '锁定';
    lockInput.placeholder = '再次输入密码可重新锁定';
    lockTip.textContent = '你是编辑者。清空密码后刷新可回到访客模式。';
  } else {
    lockGroup.style.display = '';
    lockLabel.textContent = '🔒 编辑权限';
    lockBtn.textContent = '解锁';
    lockInput.placeholder = '输入编辑密码';
    lockTip.textContent = '访客只读模式：需要编辑密码才能建造/修改';
  }
  var ce = canEdit();
  for(var i=1;i<=8;i++){ var es=document.getElementById('eset'+i); if(es) es.style.display = ce ? '' : 'none'; }
  document.getElementById('settingsMask').classList.add('show');
}
function closeSettings(){ document.getElementById('settingsMask').classList.remove('show'); }
function saveName(){ var n=document.getElementById('setName').value.trim(); if(!n){toast('名字不能为空');return;} userName=n; localStorage.setItem('gc_name',n); toast('✅ 名字已改为 '+n); }
function saveSpeak(){ speakNames=document.getElementById('setSpeak').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean); speakAll=document.getElementById('speakAll').checked; localStorage.setItem('gc_speak',speakNames.join(',')); localStorage.setItem('gc_speakAll',speakAll?'1':'0'); toast('✅ 朗读设置已保存'); }
function uploadAvatar(){ var name=document.getElementById('avatarName').value.trim(); var file=document.getElementById('avatarFile').files[0]; if(!name){toast('请输入成员名字');return;} if(!file){toast('请选择图片');return;} var reader=new FileReader(); reader.onload=function(e){ compressImage(e.target.result, 240, 0.85, function(small){ api('/api/avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,image:small})}).then(function(){ toast('✅ '+name+' 头像已更新'); loadAvatars(); }).catch(function(err){ toast('❌ '+err.message); }); }); }; reader.readAsDataURL(file); }
function loadAvatars(){ api('/api/avatar').then(function(d){ avatars=d.avatars||{}; }).catch(function(){}); }
function loadTimeSettings(){ api('/api/time_settings?room='+encodeURIComponent(currentRoom)).then(function(d){ var s=d.settings||{}; document.getElementById('setTimeMode').value=s.mode||'real'; document.getElementById('setFixedTime').value=s.fixed_time||''; }).catch(function(){}); }
function saveTimeSettings(){ api('/api/time_settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:document.getElementById('setTimeMode').value,fixed_time:document.getElementById('setFixedTime').value,room:currentRoom})}).then(function(){ toast('✅ 时间设置已保存'); }).catch(function(e){ toast('❌ '+e.message); }); }
function ts(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
function backupNow(){
  toast('⏳ 备份中…数据较大可能需要一会，请稍候');
  var ctrl = new AbortController();
  var to = setTimeout(function(){ try{ctrl.abort();}catch(e){} }, 90000);
  fetch('/api/backup', {signal:ctrl.signal}).then(function(r){
    if(!r.ok) return r.json().then(function(d){ throw new Error(d.detail || ('HTTP '+r.status)); });
    return r.json();
  }).then(function(d){
    clearTimeout(to);
    try{
      var name='linkongbackup_'+ts()+'.json';
      var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
      toast('✅ 备份成功！已下载 '+name+'（请到浏览器下载列表查看）');
    }catch(err){ toast('❌ 下载失败：'+err.message); }
  }).catch(function(e){
    clearTimeout(to);
    toast('❌ 备份失败：'+(e && e.name==='AbortError' ? '超时（数据太大，请稍后再试）' : ((e&&e.message)||'未知错误')));
  });
}
function restoreBackup(){
  var f=document.createElement('input'); f.type='file'; f.accept='.json';
  f.onchange=function(){ var file=f.files[0]; if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=JSON.parse(e.target.result);
        api('/api/restore_backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(){ toast('✅ 导入成功！数据已恢复'); setTimeout(function(){ location.reload(); }, 800); }).catch(function(err){ toast('❌ 恢复失败：'+err.message); });
      }catch(err){ toast('❌ 备份文件格式不对'); }
    };
    reader.readAsText(file);
  };
  f.click();
}
function init(){
  document.getElementById('roomName').textContent=roomLabel(currentRoom);
  document.getElementById('setSpeak').value=speakNames.join(','); document.getElementById('speakAll').checked=speakAll;
  loadRooms(); loadAvatars(); reportRoom();
  api('/api/edit_status').then(function(d){ editLocked=!!d.locked; }).catch(function(){});
  api('/api/map').then(function(d){ mapData=d; applyBg(currentRoom); updateRoomUI(); }).catch(function(){});
  restoreCache().then(function(){ loadMessages(false); }); heartbeat();
  worldSnapshot();
  setInterval(function(){ loadMessages(true); heartbeat(); if(bChatOn) loadBChat(); }, 3000);
  setInterval(checkSms, 10000);
  setInterval(worldSnapshot, 1800000);
}
init();
</script>
